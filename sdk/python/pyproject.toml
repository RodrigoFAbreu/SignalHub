[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signalhub"
# A development placeholder, never rewritten in the repository: each release
# builds the package with its own version (scripts/release/sdk_files.py) and
# attaches it. Not published to PyPI (see README.md).
version = "0.0.0.dev0"
description = "Publish events to SignalHub from Python code, shells, scripts and CI jobs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
signalhub = "signalhub.cli:run"

[tool.setuptools.package-data]
signalhub = ["py.typed"]
