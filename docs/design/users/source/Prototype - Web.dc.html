        <p class="lead">Two frames, each with its own flows. Pick a flow, then click the outlined element to move on. Back steps back, Restart starts the flow again. The screens are the designed ones, with sample data only.</p>

        <section class="blk" id="dblk" data-screen-label="Desktop frame">
          <h2>Desktop</h2>
          <div class="picker" id="dpicker" role="tablist" aria-label="Desktop flow"></div>
          <div class="ctl">
            <button class="pk" id="dback" type="button"><span class="ms">arrow_back</span>Back</button>
            <button class="pk" id="drestart" type="button"><span class="ms">restart_alt</span>Restart</button>
            <button class="pk on" id="dhot" type="button" aria-pressed="true"><span class="ms">touch_app</span>Show click targets</button>
          </div>
          <div class="fitw" id="dfit"><div class="br" id="dh"></div></div>
          <div class="strip" style="margin-top:20px">
            <p class="sh" id="dfname">Flow</p>

          <div class="ctl">
            <button class="pk" id="pback" type="button"><span class="ms">arrow_back</span>Back</button>
            <button class="pk" id="prestart" type="button"><span class="ms">restart_alt</span>Restart</button>
            <button class="pk on" id="phot" type="button" aria-pressed="true"><span class="ms">touch_app</span>Show tap targets</button>
          </div>
          <div class="stage">
            <div class="ph" id="ph" data-screen-label="Phone-width browser"></div>
            <div class="strip side">
              <p class="sh" id="pfname">Flow</p>
              <ol id="psteps"></ol>
              <p class="cap" id="pcap" aria-live="polite"></p>
            </div>
          </div>
        </section>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props="{}">
      class Component extends DCLogic {
        componentDidMount() {
          const dh = document.getElementById('dh');
          if (!dh) { setTimeout(() => this.componentDidMount(), 50); return; }
          const I = (n, c, s) => `<span class="ms${c ? ' ' + c : ''}"${s ? ` style="${s}"` : ''}>${n}</span>`;
          const N = (f, by) => ` data-n="${f}"${by ? ` data-by="${by}"` : ''}`;
          const V = (v) => ` data-vs="${v}"`;
          const chrome = (u) => `<div class="chrome"><div class="dots"><span></span><span></span><span></span></div><div class="url">${I('lock')}${u}</div></div>`;
          const phchrome = (u) => `<div class="phchrome"><div class="url">${I('lock')}${u}</div></div>`;
          const rail = (on, adm, badge, hot) => { hot = hot || {}; const t = [['inbox', 'Inbox'], ['sensors', 'Producers']]; if (adm) t.push(['group', 'People']); t.push(['settings', 'Settings']); return `<div class="rail"><span class="rlogo">${I('sensors')}</span>${t.map((x) => `<div class="ri${x[1] === on ? ' on' : ''}"${hot[x[1]] ? N(hot[x[1]]) : ''}><span class="pill">${I(x[0], x[1] === on ? 'fill' : '')}${x[1] === 'Inbox' && badge ? `<span class="nbadge">${badge}</span>` : ''}</span>${x[1]}</div>`).join('')}<span class="acct"><span class="av avp">R</span></span></div>`; };
          const nav = (on, badge, hot) => { hot = hot || {}; const t = [['inbox', 'Inbox'], ['sensors', 'Producers'], ['group', 'People'], ['settings', 'Settings']]; return `<div class="nav">${t.map((x) => `<div class="nv${x[1] === on ? ' on' : ''}"${hot[x[1]] ? N(hot[x[1]]) : ''}><span class="pill">${I(x[0], x[1] === on ? 'fill' : '')}${x[1] === 'Inbox' && badge ? `<span class="nbadge">${badge}</span>` : ''}</span>${x[1]}</div>`).join('')}</div>`; };
          const EVS = [
            ['pan_tool', 'c-error', 'Your action: approve the release', 'Action required · High · ci-pipeline', '01:19', true],
            ['info', 'c-primary', 'Nightly backup finished', 'Info · Normal · backup-jobs', '00:41', true],
            ['block', 'c-error', 'Disk almost full on nas-01', 'Blocked · Critical · homelab-monitor', '00:36', true],
            ['check_circle', 'c-var', 'Deploy to staging done', 'Completed · Low · ci-pipeline', '00:14', false],
            ['info', 'c-primary', 'Weekly report is ready', 'Info · Normal · ana-reports', 'Yesterday', true],
            ['check_circle', 'c-var', 'Photos synced', 'Completed · Low · backup-jobs', 'Yesterday', false],
            ['info', 'c-primary', 'Certificate renewed', 'Info · Normal · homelab-monitor', 'Mon', false]
          ];
          const evRow = (e, sel, un, hot) => `<div class="lt${sel ? ' sel' : ''}" style="align-items:flex-start"${hot ? N(hot) : ''}><span class="ms ${e[1]}" style="margin-top:2px">${e[0]}</span><div class="tx"><span class="${un ? 't1b' : 't1'}">${e[2]}</span><div class="meta"><span class="m1">${e[3]}</span><span>${e[4]}</span></div></div><span class="${un ? 'dot' : 'nodot'}" style="margin-top:7px"></span></div>`;
          const evList = (sel, hotIdx, hotTok) => EVS.map((e, i) => evRow(e, i === sel, e[5] && i !== sel, i === hotIdx ? hotTok : '')).join('');
          const detail = (i) => i === 0
            ? `<div class="row" style="justify-content:flex-end"><span class="btn-x">${I('mark_email_unread')}Mark as unread</span></div><h1 class="h">Your action: approve the release</h1><div class="chips"><span class="chip">${I('pan_tool')}Action required</span><span class="chip">${I('priority_high', 'c-error')}High</span></div><p class="body">The release of 3.0.0 is waiting at the approval gate. Check the changelog and the upgrade notes, then approve it in the pipeline.</p><div><span class="btn-t">${I('open_in_new')}Open link</span></div><div class="kv"><b>Producer</b><span>ci-pipeline</span><b>Context</b><span>release-3.0.0</span><b>Received</b><span>2026-10-10 01:19</span></div>`
            : `<div class="row" style="justify-content:flex-end"><span class="btn-x">${I('mark_email_unread')}Mark as unread</span></div><h1 class="h">Disk almost full on nas-01</h1><div class="chips"><span class="chip">${I('block')}Blocked</span><span class="chip">${I('priority_high', 'c-error')}Critical</span></div><div class="kv"><b>Producer</b><span>homelab-monitor</span><b>Received</b><span>2026-10-10 00:36</span></div>`;
          const emptyDet = `<div class="empty">${I('inbox')}<h2 class="h3">Select an event</h2><p class="p">Pick one from the list to read it here.</p></div>`;
          const inboxScr = (o) => chrome(o.url) + (o.banner || '') + `<div class="app">` + rail('Inbox', true, o.badge, o.rail) + `<div class="listp"><div class="phead"><div class="t">Inbox</div><span class="ib">${I('filter_list')}</span><span class="ib">${I('done_all')}</span></div>${evList(o.sel, o.hotIdx, o.hotTok)}</div><div class="detp">${o.sel >= 0 ? detail(o.sel) : emptyDet}</div></div>`;
          const brand = `<div class="brand"><span class="logo">${I('sensors')}</span>SignalHub</div>`;
          const waitRow = (t) => `<div class="wait"><span class="spin"></span>${t}</div>`;
          const mini = (inner) => `<div class="aph mini">${inner}</div>`;
          const asb = (t) => `<div class="sb">${t}</div>`;
          const aab = (t) => `<div class="appbar"><span class="ib">${I('close')}</span><div class="t">${t}</div></div>`;
          const sheet = (hot) => `<div class="scrim"></div><div class="sheet"><div class="handle"></div><h2 class="h2s">Sign in this browser?</h2><div class="fact">${I('language')}<span><b>Firefox on Linux</b></span></div><div class="fact">${I('schedule')}<span>Asked just now</span></div><p class="p" style="font-size:13px;line-height:18px">Only sign in a browser you are looking at right now. It can read and send what you can for 30 days, or until you sign it out.</p><div class="acts"><span class="btn-x">Cancel</span><span class="btn-f"${hot ? N(hot) : ''}>Sign in</span></div></div>`;
          const phoneOk = `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 28px 60px;text-align:center"><span class="okmark">${I('check')}</span><div style="font-size:20px;line-height:26px">Browser signed in</div><p class="p">Firefox on Linux can now use your SignalHub for 30 days. You can sign it out any time in Devices.</p><span class="btn-f" style="margin-top:8px">Done</span></div>`;
          const producers = [['ci-pipeline', 'Public · 2 keys · last event 01:19', 1, 1], ['homelab-monitor', 'Private · 2 people · last event 00:36', 1, 1], ['ana-reports', 'Ana · Public', 0, 1], ['family-calendar', 'Ana · Private, shared with you', 0, 1], ['price-watch', 'João · Public', 0, 0], ['weather-alerts', 'João · Public', 0, 0]];
          const pRow = (p, sel, hot, vs, w) => `<div class="lt${sel ? ' sel' : ''}"${vs ? V(vs) : ''}${hot ? N(hot) : ''}><span class="av">${I('sensors')}</span><div class="tx"><span class="t1">${p[0]}${p[2] ? '<span class="own">Yours</span>' : ''}</span><span class="t2n">${p[1]}</span></div><span class="tbtn ${p[3] ? 'on' : 'off'}">${I(p[3] ? 'notifications_active' : 'notifications', p[3] ? 'fill' : '')}</span></div>`;
          const chips = (on, hot, yours) => ['All', 'Yours', 'Subscribed', 'Can subscribe'].map((c) => `<span class="fc${c === on ? ' on' : ''}"${hot && hot[c] ? N(hot[c]) : ''}>${c === on ? I('check', 'ms18') : ''}${c}</span>`).join('');
          const prodBody = `<div class="row"><h1 class="h">homelab-monitor</h1><span class="ib" role="button" aria-label="Rename homelab-monitor">${I('edit')}</span></div><span class="t2n">Last event 00:36</span><div class="lt" style="padding:0;max-width:640px">${I('notifications_active', 'c-primary fill')}<div class="tx"><span class="t1">Subscribed</span><span class="t2w">Its events are in your inbox</span></div><span class="sw" role="switch" aria-checked="true"></span></div><div class="lab" style="padding:8px 0 0">Who can see it</div><div class="seg"><span class="on">${I('lock', 'ms18')}Private</span><span>${I('public', 'ms18')}Public</span></div><span class="t2n">Shared with 2 people</span><div class="chips"><span class="pchip"><span class="avs">A</span>Ana${I('close', 'ms18 c-var')}</span><span class="pchip"><span class="avs">M</span>Marta${I('close', 'ms18 c-var')}</span><span class="pchip" style="color:var(--primary)">${I('person_add', 'ms18')}Add people</span></div><div class="lab" style="padding:8px 0 0">Keys</div><div class="keyrow">${I('key', 'c-var')}<div class="tx"><span class="t1 mono" style="font-size:14px">shpk1_EXAMPLE…</span><span class="t2n">Created 27 Sep · last used 00:36</span></div><span class="btn-x">Revoke</span></div><div class="keyrow">${I('key', 'c-var')}<div class="tx"><span class="t1 mono" style="font-size:14px">shpk1_EXAMPLE…</span><span class="t2n">Created 2 Oct · not used yet</span></div><span class="btn-x">Revoke</span></div><div class="row"><span class="t2n">Needs a server change (queued with the design lock-in)</span></div><div class="row"><span class="btn-o">${I('add')}New key</span></div><div class="keyrow">${I('filter_list', 'c-var')}<div class="tx"><span class="t1">See its events</span></div>${I('chevron_right', 'c-var')}</div><div class="keyrow">${I('pause_circle', 'c-var')}<div class="tx"><span class="t1">Disable</span><span class="t2w">Its keys stop working. Its events stay.</span></div></div>`;
          const prodDet = prodBody;
          const prodsScr = (state) => chrome(state === 'detail' ? 'signalhub.example/app/#producers/01997d60-2f4b-7c3a…' : 'signalhub.example/app/#producers') + `<div class="app">` + rail('Producers', true, 3, state === 'detail' ? { Settings: 'd1' } : {}) +
            `<div class="listp"><div class="phead"><div class="t">Producers</div></div><div class="search">${I('search')}Find a producer</div>` +
            (state === 'detail' ? `<div class="fchips">${chips('Yours')}</div>` : `<div class="fchips"${V('base')}>${chips('All', { Yours: 'd1@base' })}</div><div class="fchips"${V('yours')}>${chips('Yours')}</div>`) +
            producers.map((p, i) => (state === 'detail' ? (p[2] ? pRow(p, i === 1) : '') : pRow(p, false, i === 1 ? 'd1@yours' : '', p[2] ? '' : 'base'))).join('') +
            `<div class="fab">${I('add')}New producer</div></div><div class="detp${state === 'detail' ? ' prod' : ''}">${state === 'detail' ? prodDet : ''}</div></div>`;

          /* ---- desktop screens ---- */
          const D = {};
          const signCard = (h, p, qrHot, size, lab, wait, linkHot) => `<div class="card">${brand}<h1 class="ch">${h}</h1><p class="p">${p}</p><div class="qrwrap"><div class="qr"${size ? ` style="width:${size}px;height:${size}px"` : ''}${qrHot ? N(qrHot) : ''} role="img" aria-label="Sign-in QR code. To sign in without scanning, use a code instead.">${lab || ''}</div></div>${waitRow(wait)}${linkHot !== undefined ? `<div class="link"${linkHot ? N(linkHot) : ''}>Use a code instead</div>` : ''}</div>`;
          const codeCard = (hot) => `<div class="card">${brand}<h1 class="ch">Sign in with a code</h1><p class="p">Open SignalHub on your phone, go to Settings › Sign in a browser, choose Type a code and enter this code.</p><div class="code"${hot ? N(hot) : ''}>K7Q-4MX</div>${waitRow('Waiting for your phone · 2:41')}<div class="link">Back to the QR code</div></div>`;
          const signIn = (url, inner) => chrome(url) + `<div class="page">${inner}</div>`;
          D.qr = signIn('signalhub.example/app/', signCard('Sign in with your phone', 'Open SignalHub on your phone, go to Settings › Sign in a browser, and scan this code.', 'd1', 0, 'sign-in QR code', 'Waiting for your phone · 2:41', 'd2'));
          D.approve = signIn('signalhub.example/app/', signCard('Sign in with your phone', 'Open SignalHub on your phone, go to Settings › Sign in a browser, and scan this code.', '', 0, 'sign-in QR code', 'Waiting for your phone · 2:41', '') + mini(asb('20:05') + aab('Sign in a browser') + `<div class="scan"><div class="frame"></div>camera preview</div>` + sheet('d1')));
          D.code = signIn('signalhub.example/app/', codeCard('d2'));
          D.approve2 = signIn('signalhub.example/app/', codeCard('') + mini(asb('20:06') + aab('Sign in a browser') + `<div class="scan"><div class="frame"></div>camera preview</div>` + sheet('d2')));
          D.signed = signIn('signalhub.example/app/', `<div class="card">${brand}<span class="okmark">${I('check')}</span><h1 class="ch" style="text-align:center">Signed in as Rodrigo</h1><p class="p" style="text-align:center">Approved from Rodrigo - Pixel 9. Opening your inbox…</p><div class="wait"><span class="spin"></span></div></div>` + mini(asb('20:05') + aab('Sign in a browser') + phoneOk));
          D.inbox = inboxScr({ url: 'signalhub.example/app/#inbox', sel: -1, badge: 4, hotIdx: 0, hotTok: 'd1' });
          D.event = inboxScr({ url: 'signalhub.example/app/#inbox/01997d5e-8a3c-7b1e…', sel: 0, badge: 3, rail: { Producers: 'd1' } });
          D.prods = prodsScr('list');
          D.prod = prodsScr('detail');
          D.settings = chrome('signalhub.example/app/#settings') + `<div class="app">${rail('Settings', true, 3)}<div class="detp solo"><h1 class="h">Settings</h1><div class="grp"><div class="gh" style="min-height:72px">${I('devices', 'c-var')}<div class="tx"><span class="t1">Devices</span><span class="t2n">4 devices · 2 browsers</span></div>${I('chevron_right', 'c-var')}</div></div><div class="grp"><div class="gh">${I('dns', 'c-var')}<div class="tx"><span class="t1">About this server</span><span class="t2n">signalhub.example</span></div>${I('expand_less', 'c-var')}</div><div class="gb"><div class="kvr"><div class="tx"><span class="t2n">Server</span><span class="t1">https://signalhub.example</span></div></div><div class="kvr"><div class="tx"><span class="t1">Server: SignalHub 3.4.0 · commit a1b2c3d</span><span class="t2n">Needs a server change (queued with the design lock-in)</span></div></div><div class="kvr">${I('info', 'c-var')}<span class="p">The host runs this server and can see every event on it.</span></div></div></div><div class="grp"><div class="gh">${I('language', 'c-var')}<div class="tx"><span class="t1">This browser</span><span class="t2n">Firefox on Linux · signed in until 2026-11-09</span></div>${I('expand_less', 'c-var')}</div><div class="gb"><div class="kvr"><div class="tx"><span class="t2n">Name</span><span class="t1">Firefox on Linux</span></div><span class="btn-x">${I('edit')}Rename</span></div><div class="kvr"><div class="tx"><span class="t2n">Signed in</span><span class="t1">2026-10-10 · lasts 30 days, until 2026-11-09</span></div></div><div class="kvr"><div class="tx"><span class="t2n">This page</span><span class="t1">SignalHub 3.4.0 · commit a1b2c3d (sample)</span></div></div><div class="kvr"><span class="btn-o"${N('d1')}>${I('logout')}Sign out</span><span class="p">Signing out here leaves your phone's app untouched.</span></div></div></div></div></div>`;
          D.signoutdlg = chrome('signalhub.example/app/#settings') + `<div class="app">${rail('Settings', true, 0)}<div class="detp solo"><h1 class="h">Settings</h1><div class="skel" style="width:60%"></div><div class="skel" style="width:40%"></div></div><div class="scrim"></div><div class="dlgw"><div class="dlg" role="dialog"><h2 class="h2">Sign out of this browser?</h2><p class="p" style="font-size:16px;line-height:24px">This browser stops being a device of yours. Your phone and your other devices are not affected.</p><div class="acts"><span class="btn-x">Cancel</span><span class="btn-x"${N('d1')}>Sign out</span></div></div></div></div>`;
          D.signedout = signIn('signalhub.example/app/#settings', signCard("You're signed out", "This browser isn't signed in. Sign in with your phone to use SignalHub here.", '', 128, '', 'Waiting for your phone · 2:41'));
          /* session ended */
          D.ended = inboxScr({ url: 'signalhub.example/app/#inbox/01997d5e-8a3c-7b1e…', sel: 2, badge: 3, banner: `<div class="banner">${I('lock_clock')}<span class="tx">Your sign-in ended.</span><span class="btn-x"${N('d3')}>Sign in again</span></div>` });
          D.again = signIn('signalhub.example/app/#inbox/01997d5e-8a3c-7b1e…', signCard('Sign in again', "Your sign-in on this browser ended. Sign in with your phone and you'll come back to the page you were on.", 'd3', 128, '', 'Waiting for your phone · 2:41'));
          D.back = inboxScr({ url: 'signalhub.example/app/#inbox/01997d5e-8a3c-7b1e…', sel: 2, badge: 3 });
          const DF = {
            d1: { name: '1 · Desktop sign-in, then around the page', steps: [
              ['qr', 'The page shows a QR code', 'Click the code, as if the phone scanned it.'],
              ['approve', 'The app asks: Sign in this browser?', 'Click Sign in on the phone.'],
              ['signed', 'Signed in as Rodrigo', 'The page opens the inbox by itself.', 1500],
              ['inbox', 'The inbox', 'Click an event to open it.'],
              ['event', 'The open event', 'Click Producers in the rail.'],
              ['prods', 'Producers: search and chips', 'Click the Yours chip.'],
              ['prods:yours', 'Yours', 'Click homelab-monitor.'],
              ['prod', 'A producer', 'Click Settings in the rail.'],
              ['settings', 'Settings', 'Click Sign out.'],
              ['signoutdlg', 'Sign out of this browser?', 'Click Sign out.'],
              ['signedout', "You're signed out", 'End of the flow.'] ] },
            d2: { name: '2 · Desktop sign-in with a code', steps: [
              ['qr', 'The page shows a QR code', 'Click Use a code instead.'],
              ['code', 'Sign in with a code', 'Click the code, as if it was typed in the app.'],
              ['approve2', 'The app asks: Sign in this browser?', 'Click Sign in on the phone.'],
              ['signed', 'Signed in as Rodrigo', 'The page opens the inbox by itself.', 1500],
              ['inbox', 'The inbox', 'End of the flow.'] ] },
            d3: { name: '3 · Session ended, and back to the same address', steps: [
              ['ended', 'The banner: Your sign-in ended.', 'Click Sign in again.'],
              ['again', 'Sign in again, at the same address', 'Click the code, as if the phone scanned it.'],
              ['back', 'Back at the same address', 'End of the flow.'] ] }
          };

          /* ---- phone-width screens ---- */
          const P = {};
          P.code = phchrome('signalhub.example/app/') + `<div class="mpage">${brand}<h1 class="ch">Sign in with the app</h1><p class="p">A phone can't scan its own screen, so type this code in the SignalHub app.</p><div class="code">K7Q-4MX</div>${waitRow('Waiting for the app · 2:41')}<span class="btn-f full"${N('p2')}>${I('open_in_new')}Open the app</span><ol class="steps"><li>Open the app.</li><li>Go to Settings › Sign in a browser.</li><li>Choose "Type a code" and enter the code above.</li></ol><p class="p" style="font-size:13px">No app on this phone? Ask an admin of this server.</p></div>`;
          P.app = `<div class="aph full">${asb('20:06')}${aab('Sign in a browser')}<div style="display:flex;flex-direction:column;gap:14px;padding:12px 16px"><p class="p">Enter the code the page shows.</p><div class="tf focus"><span class="fl">Code</span><span style="font-family:'Roboto Mono',monospace;letter-spacing:3px">K7Q-4MX</span></div><div class="acts"><span class="btn-f"${V('base')}${N('p2@base')}>Continue</span></div></div><div${V('sheet')}>${sheet('p2@sheet')}</div></div>`;
          const phHead = (t, right) => `<div class="phead" style="padding-left:16px"><div class="t">${t}</div>${right || ''}</div>`;
          const lt2 = (e) => `<div class="lt" style="align-items:flex-start"><span class="ms ${e[1]}" style="margin-top:2px">${e[0]}</span><div class="tx"><span class="${e[5] ? 't1b' : 't1'}">${e[2]}</span><div class="meta"><span class="m1">${e[3]}</span><span>${e[4]}</span></div></div><span class="${e[5] ? 'dot' : 'nodot'}" style="margin-top:7px"></span></div>`;
          P.inbox = phchrome('signalhub.example/app/#inbox') + phHead('SignalHub', `<span class="ib">${I('filter_list')}</span><span class="ib">${I('done_all')}</span><span class="ib"><span class="mini">R</span></span>`) + `<div class="pbody">${EVS.slice(1, 7).map(lt2).join('')}</div>` + nav('Inbox', 3, { Producers: 'p2b' });
          const pRowP = (p, hot) => `<div class="lt"${hot ? N(hot) : ''}><span class="av">${I('sensors')}</span><div class="tx"><span class="t1">${p[0]}${p[2] ? '<span class="own">Yours</span>' : ''}</span><span class="t2n">${p[1]}</span></div><span class="tbtn ${p[3] ? 'on' : 'off'}">${I(p[3] ? 'notifications_active' : 'notifications', p[3] ? 'fill' : '')}</span></div>`;
          P.prods = phchrome('signalhub.example/app/#producers') + phHead('Producers', `<span class="ib"><span class="mini">R</span></span>`) + `<div class="search">${I('search')}Find a producer</div><div class="fchips">${chips('All')}</div><div class="pbody">${producers.map((p, i) => pRowP(p, i === 1 ? 'p2b' : '')).join('')}</div><div class="fab" style="bottom:96px">${I('add')}New producer</div>` + nav('Producers', 3);
          P.detail = phchrome('signalhub.example/app/#producers/01997d60-2f4b-7c3a…') + `<div class="phead" style="padding-left:4px"><span class="ib" role="button" aria-label="Back">${I('arrow_back')}</span><div class="t">homelab-monitor</div><span class="ib" role="button" aria-label="Rename homelab-monitor">${I('edit')}</span></div><div class="pform" style="gap:8px"><span class="t2n">Last event 00:36</span><div class="lt" style="padding:0">${I('notifications_active', 'c-primary fill')}<div class="tx"><span class="t1">Subscribed</span><span class="t2w">Its events are in your inbox</span></div><span class="sw" role="switch" aria-checked="true"></span></div><div class="lab" style="padding:8px 0 0">Who can see it</div><div class="seg" style="width:100%"><span class="on">${I('lock', 'ms18')}Private</span><span>${I('public', 'ms18')}Public</span></div><span class="t2n">Shared with 2 people</span><div class="chips"><span class="pchip"><span class="avs">A</span>Ana${I('close', 'ms18 c-var')}</span><span class="pchip"><span class="avs">M</span>Marta${I('close', 'ms18 c-var')}</span><span class="pchip" style="color:var(--primary)">${I('person_add', 'ms18')}Add people</span></div><div class="lab" style="padding:8px 0 0">Keys</div><div class="keyrow">${I('key', 'c-var')}<div class="tx"><span class="t1 mono" style="font-size:14px">shpk1_EXAMPLE…</span><span class="t2n">Created 27 Sep · last used 00:36</span></div><span class="btn-x">Revoke</span></div><div class="keyrow">${I('key', 'c-var')}<div class="tx"><span class="t1 mono" style="font-size:14px">shpk1_EXAMPLE…</span><span class="t2n">Created 2 Oct · not used yet</span></div><span class="btn-x">Revoke</span></div><div class="row"><span class="btn-o">${I('add')}New key</span></div><div class="keyrow">${I('filter_list', 'c-var')}<div class="tx"><span class="t1">See its events</span></div>${I('chevron_right', 'c-var')}</div><div class="keyrow">${I('pause_circle', 'c-var')}<div class="tx"><span class="t1">Disable</span><span class="t2w">Its keys stop working. Its events stay.</span></div></div></div>` + nav('Producers', 0);
          const PF = {
            p2: { name: '2 · Phone-width sign-in', steps: [
              ['code', 'The page shows a code', 'Tap Open the app.'],
              ['app', 'The app: type the code', 'Tap Continue.'],
              ['app:sheet', 'Sign in this browser?', 'Tap Sign in.'],
              ['inbox', 'The inbox', 'End of the flow.'] ] },
            p2b: { name: 'Producers at phone width', steps: [
              ['inbox', 'The inbox', 'Tap Producers.'],
              ['prods', 'Producers', 'Tap homelab-monitor.'],
              ['detail', 'A producer', 'End of the flow.'] ] }
          };

          /* ---- a small stepper used by both frames ---- */
          const stage = (p, host, S, F, first) => {
            host.innerHTML = Object.keys(S).map((id) => `<div class="scr" data-s="${id}" data-screen-label="${id}">${S[id]}</div>`).join('');
            host.querySelectorAll('[data-n]').forEach((e) => { e.setAttribute('role', 'button'); e.setAttribute('tabindex', '0'); });
            let flow = first, idx = 0, timer = null;
            const $ = (s) => document.getElementById(p + s);
            const blk = document.getElementById(p === 'd' ? 'dblk' : 'pblk');
            const shown = (e) => e.getClientRects().length > 0;
            const render = () => {
              const steps = F[flow].steps;
              const parts = steps[idx][0].split(':');
              const id = parts[0], v = parts[1] || 'base';
              host.querySelectorAll('.scr').forEach((s) => { s.style.display = s.dataset.s === id ? 'flex' : 'none'; });
              const scr = host.querySelector('.scr[data-s="' + id + '"]');
              host.querySelectorAll('.hot').forEach((e) => { e.classList.remove('hot'); e._hot = false; });
              scr.querySelectorAll('[data-vs]').forEach((e) => { e.style.display = e.dataset.vs.split(' ').indexOf(v) >= 0 ? '' : 'none'; });
              scr.querySelectorAll('[data-n]').forEach((e) => {
                const hot = e.dataset.n.split(' ').some((t) => { const q = t.split('@'); return q[0] === flow && (!q[1] || q[1] === v); }) && shown(e);
                e._hot = hot; e.classList.toggle('hot', hot);
              });
              $('fname').textContent = F[flow].name;
              $('steps').innerHTML = steps.map((s, i) => `<li class="${i < idx ? 'done' : i === idx ? 'cur' : ''}"${i === idx ? ' aria-current="step"' : ''}><b>${i < idx ? '✓' : i + 1}</b>${s[1]}</li>`).join('');
              $('cap').innerHTML = `<span>Step ${idx + 1} of ${steps.length}</span>${steps[idx][2]}`;
              $('back').disabled = idx === 0;
              $('picker').querySelectorAll('.pk').forEach((b) => { const on = b.dataset.f === flow; b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false'); });
              if (steps[idx][3]) timer = setTimeout(() => go(idx + 1), steps[idx][3]);
            };
            const go = (i) => { clearTimeout(timer); idx = Math.max(0, Math.min(F[flow].steps.length - 1, i)); render(); };
            $('picker').innerHTML = Object.keys(F).map((k) => `<button class="pk" type="button" role="tab" data-f="${k}">${F[k].name}</button>`).join('');
            $('picker').addEventListener('click', (e) => { const b = e.target.closest('.pk'); if (b) { flow = b.dataset.f; go(0); } });
            $('back').addEventListener('click', () => go(idx - 1));
            $('restart').addEventListener('click', () => go(0));
            $('hot').addEventListener('click', () => { const on = !blk.classList.contains('nohot'); blk.classList.toggle('nohot', on); $('hot').classList.toggle('on', !on); $('hot').setAttribute('aria-pressed', on ? 'false' : 'true'); });
            const tap = (t) => { let e = t.closest('[data-n]'); while (e && !e._hot) e = e.parentElement && e.parentElement.closest('[data-n]'); if (e && e._hot) go(idx + (+e.dataset.by || 1)); };
            host.addEventListener('click', (ev) => tap(ev.target));
            host.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); tap(ev.target); } });
            go(0);
          };
          stage('d', dh, D, DF, 'd1');
          stage('p', document.getElementById('ph'), P, PF, 'p2');

          const fit = () => { const w = document.getElementById('dfit').clientWidth; const z = Math.min(1, w / 1280); dh.style.zoom = z; document.getElementById('dfit').style.height = Math.round(840 * z) + 'px'; };
          fit(); window.addEventListener('resize', fit);
        }
        renderVals() { return {}; }
      }
    </script>
  </body>
</html>
