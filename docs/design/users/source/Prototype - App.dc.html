      <div class="pt" id="pt" data-screen-label="Prototype: App">
        <h1>Prototype - App</h1>

        <div class="picker" id="picker" role="tablist" aria-label="Flow"></div>
        <div class="ctl">
          <button class="pk" id="b-back" type="button"><span class="ms">arrow_back</span>Back</button>
          <button class="pk" id="b-restart" type="button"><span class="ms">restart_alt</span>Restart</button>
          <button class="pk on" id="b-hot" type="button" aria-pressed="true"><span class="ms">touch_app</span>Show tap targets</button>
        </div>
        <div class="stage">
          <div class="ph" id="ph" data-screen-label="Phone"></div>
          <div class="strip">
            <p class="sh" id="fname">Flow</p>
            <ol id="steps"></ol>
            <p class="cap" id="cap" aria-live="polite"></p>
          </div>
        </div>

    <script type="text/x-dc" data-dc-script data-props="{}">
      class Component extends DCLogic {
        componentDidMount() {
          const ph = document.getElementById('ph');
          if (!ph) { setTimeout(() => this.componentDidMount(), 50); return; }
          const I = (n, c, s) => `<span class="ms${c ? ' ' + c : ''}"${s ? ` style="${s}"` : ''}>${n}</span>`;
          const N = (f, by) => ` data-n="${f}"${by ? ` data-by="${by}"` : ''}`;
          const V = (v) => ` data-vs="${v}"`;

            ev('pan_tool', 'c-err', 'Your action: approve the release', 'Action required · High · ci-pipeline', '01:19', true) + ev('info', 'c-primary', 'Nightly backup finished', 'Info · Normal · backup-jobs', '00:41', true) + ev('block', 'c-err', 'Disk almost full on nas-01', 'Blocked · Critical · homelab-monitor', '00:36', true) +
            ev('check_circle', 'c-var', 'Deploy to staging done', 'Completed · Low · ci-pipeline', '00:14', false) + ev('info', 'c-primary', 'Weekly report is ready', 'Info · Normal · ana-reports', 'Yesterday', false) + ev('check_circle', 'c-var', 'Photos synced', 'Completed · Low · backup-jobs', 'Yesterday', false) +
            `</div>` + nav('Inbox', true, 3);

          /* ---- flows ---- */
          const F = {
            f1: { name: '1 · An invited person\'s first run', steps: [
              ['setup', 'Scan the invitation', 'Tap the camera preview to scan the code.'],
              ['welcome', 'Welcome', 'Tap Later.'],
              ['inbox0', 'Empty inbox', 'Tap Find producers.'],
              ['prodcs', 'Producers, Can subscribe', 'Tap the bell of ana-reports to subscribe.'],
              ['prodcs:sub', 'Subscribed, with the snackbar', 'Tap the Inbox tab.'],
              ['inbox1', 'Back to the inbox, with an event', 'End of the flow.'] ] },
            f2: { name: '2 · A new producer and its key', steps: [
              ['prodmy', 'Producers', 'Tap New producer.'],
              ['newp', 'New producer', 'Tap the Name field to type garage-door.'],
              ['newp:typed', 'Name and Private', 'Tap Create.'],
              ['key', 'The key, shown once', 'Tap Copy.'],
              ['key:copied', 'Copied', 'Tap Done.'],
              ['pp', 'The producer\'s page', 'Tap Add people.'],
              ['addp', 'Add people', 'Tap Save.'],
              ['pp:saved', 'Saved', 'End of the flow.'] ] },
            f3: { name: '3 · Admin: invite, role, revoke', steps: [
              ['people', 'People', 'Tap Invite.'],
              ['invite', 'Invite someone', 'Tap the name field to type Rui.'],
              ['invite:typed', 'Name and Basic', 'Tap Make invitation.'],
              ['qr', 'The pairing QR', 'Tap the code to let Rui scan it.'],
              ['joined', 'Rui joined', 'Tap Done.'],
              ['people2', 'People, with Rui', 'Tap Rui.'],
              ['person', 'Rui, Basic', 'Tap Mod.'],
              ['person:dlg', 'Confirm the role', 'Tap Make Mod.'],
              ['person:mod', 'Rui, Mod, and their devices', 'Tap Revoke on Rui - iPhone.'],
              ['person:rev', 'Confirm the revoke', 'Tap Revoke.'],
              ['person:done', 'Revoked', 'End of the flow.'] ] },
            f4: { name: '4 · Mod: own devices, sign in a browser', steps: [
              ['modset', 'Settings', 'Tap Devices.'],
              ['devs', 'Devices (their own)', 'Tap Connect a device.'],
              ['connname', 'Connect a device: name', 'Tap the Name field to type Ana - Phone 2.'],
              ['connname:typed', 'Name of the new device', 'Tap Show code.'],
              ['conn', 'Connect a device: the code', 'Tap the code to let the other device scan it.'],
              ['connused', 'Used', 'Tap Done.'],
              ['devs:more', 'Devices, with the new one', 'Tap the back arrow.'],
              ['modset2', 'Settings', 'Tap Sign in a browser.'],
              ['scan', 'The scanner', 'Tap the camera preview to scan the page\'s code.'],
              ['scan:sheet', 'Sign in this browser?', 'Tap Sign in.'],
              ['scandone', 'Browser signed in', 'End of the flow.'] ] },
            f5: { name: '5 · An existing device after the update', steps: [
              ['whatsnew', 'The What\'s new card', 'Tap Got it.'],
              ['inbox5', 'The inbox, with the bottom bar', 'End of the flow.'] ] }
          };

          ph.innerHTML = Object.keys(S).map((id) => `<div class="scr" data-s="${id}" data-screen-label="${id}">${S[id]}</div>`).join('');
          ph.querySelectorAll('[data-n]').forEach((e) => { e.setAttribute('role', 'button'); e.setAttribute('tabindex', '0'); });

          let flow = 'f1', idx = 0, timer = null;
          const root = document.getElementById('pt');
          const $ = (id) => document.getElementById(id);
          const isShown = (e) => e.getClientRects().length > 0;

          const render = () => {
            const steps = F[flow].steps;
            const parts = steps[idx][0].split(':');
            const id = parts[0], v = parts[1] || 'base';
            ph.querySelectorAll('.scr').forEach((s) => { s.style.display = s.dataset.s === id ? 'flex' : 'none'; });
            const scr = ph.querySelector('.scr[data-s="' + id + '"]');
            scr.querySelectorAll('[data-vs]').forEach((e) => { e.style.display = e.dataset.vs.split(' ').indexOf(v) >= 0 ? '' : 'none'; });
            scr.querySelectorAll('[data-n]').forEach((e) => {
              const hot = e.dataset.n.split(' ').some((t) => { const q = t.split('@'); return q[0] === flow && (!q[1] || q[1] === v); }) && isShown(e);
              e._hot = hot; e.classList.toggle('hot', hot);
            });
            $('fname').textContent = F[flow].name;
            $('steps').innerHTML = steps.map((s, i) => `<li class="${i < idx ? 'done' : i === idx ? 'cur' : ''}"${i === idx ? ' aria-current="step"' : ''}><b>${i < idx ? '✓' : i + 1}</b>${s[1]}</li>`).join('');
            $('cap').innerHTML = `<span>Step ${idx + 1} of ${steps.length}</span>${steps[idx][2]}`;
            $('b-back').disabled = idx === 0;
            document.querySelectorAll('#picker .pk').forEach((b) => { const on = b.dataset.f === flow; b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false'); });
          };
          const go = (i) => { clearTimeout(timer); idx = Math.max(0, Math.min(F[flow].steps.length - 1, i)); render(); };

          $('picker').innerHTML = Object.keys(F).map((k) => `<button class="pk" type="button" role="tab" data-f="${k}">${F[k].name}</button>`).join('');
          $('picker').addEventListener('click', (e) => { const b = e.target.closest('.pk'); if (b) { flow = b.dataset.f; go(0); } });
          $('b-back').addEventListener('click', () => go(idx - 1));
          $('b-restart').addEventListener('click', () => go(0));
          $('b-hot').addEventListener('click', () => { const on = !root.classList.contains('nohot'); root.classList.toggle('nohot', on); $('b-hot').classList.toggle('on', !on); $('b-hot').setAttribute('aria-pressed', on ? 'false' : 'true'); });
          const tap = (t) => { let e = t.closest('[data-n]'); while (e && !e._hot) e = e.parentElement && e.parentElement.closest('[data-n]'); if (e && e._hot) go(idx + (+e.dataset.by || 1)); };
          ph.addEventListener('click', (ev2) => tap(ev2.target));
          ph.addEventListener('keydown', (ev2) => { if (ev2.key === 'Enter' || ev2.key === ' ') { ev2.preventDefault(); tap(ev2.target); } });
          go(0);
        }
        renderVals() { return {}; }
      }
    </script>
  </body>
</html>
