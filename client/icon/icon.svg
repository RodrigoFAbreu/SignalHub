<!-- The SignalHub app icon: a hub sending signals. Full-bleed artwork on a
     108-unit canvas, the size of an Android adaptive icon; the platform
     masks the corners. The glyph is repeated in the Android vector
     drawables (android/app/src/main/res/drawable/ic_launcher_foreground.xml
     and ic_notification.xml);
     keep them in step. Render the PNGs with ./render.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <rect width="108" height="108" fill="#3949AB"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round">
    <path d="M65.31,42.69 A16,16 0 0,1 65.31,65.31"/>
    <path d="M42.69,65.31 A16,16 0 0,1 42.69,42.69"/>
    <path d="M73.09,34.91 A27,27 0 0,1 73.09,73.09"/>
    <path d="M34.91,73.09 A27,27 0 0,1 34.91,34.91"/>
  </g>
  <circle cx="54" cy="54" r="7" fill="#FFFFFF"/>
</svg>
