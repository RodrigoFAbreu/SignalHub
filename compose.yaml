# SignalHub backend and PostgreSQL.
#
#   cp .env.example .env    # then set SIGNALHUB_DB_PASSWORD
#   docker compose up --wait
#
# A release's deployment files run its published backend image; see
# docs/deployment.md. In a checkout, the backend is built from source with
# `docker compose up --build --wait`; see docs/development.md#docker-compose.
# The "proxy" profile adds the TLS reverse proxy that serves SignalHub to
# other machines.
name: signalhub

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SIGNALHUB_DB_NAME:-signalhub}
      POSTGRES_USER: ${SIGNALHUB_DB_USERNAME:-signalhub}
      POSTGRES_PASSWORD: ${SIGNALHUB_DB_PASSWORD:?set SIGNALHUB_DB_PASSWORD, see .env.example}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username \"$$POSTGRES_USER\" --dbname \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    # Not published to the host: only the backend talks to the database.

  backend:
    # Built from source. A release's deployment files replace these two lines
    # with the release's published image (scripts/release/deployment_files.py).
    build: ./backend
    image: signalhub-backend:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    environment:
      SIGNALHUB_DB_URL: jdbc:postgresql://postgres:5432/${SIGNALHUB_DB_NAME:-signalhub}
      SIGNALHUB_DB_USERNAME: ${SIGNALHUB_DB_USERNAME:-signalhub}
      SIGNALHUB_DB_PASSWORD: ${SIGNALHUB_DB_PASSWORD:?set SIGNALHUB_DB_PASSWORD, see .env.example}
      # Enables the producer management API. Empty or unset disables it.
      SIGNALHUB_ADMIN_TOKEN: ${SIGNALHUB_ADMIN_TOKEN:-}
      # true writes JSON logs, one object per line, for log collectors.
      SIGNALHUB_LOG_JSON: ${SIGNALHUB_LOG_JSON:-false}
      # How long events are kept, such as 365d. Empty or unset keeps them forever.
      SIGNALHUB_EVENTS_RETENTION: ${SIGNALHUB_EVENTS_RETENTION:-}
    ports:
      # Localhost only: the API has no TLS, and health, metrics and the
      # management API are for the host. Other machines go through the proxy.
      # See docs/architecture.md#security-limitations.
      - "127.0.0.1:${SIGNALHUB_HTTP_PORT:-8080}:8080"
    # The image's HEALTHCHECK polls readiness (/q/health/ready).

  # Terminates TLS and forwards only the product API (/api/) to the backend.
  # Enabled with COMPOSE_PROFILES=proxy; see docs/deployment.md.
  proxy:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    profiles: [proxy]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Caddy's own error for a missing setting does not name it.
    command:
      - sh
      - -c
      - |
        if [ -z "$$SIGNALHUB_DOMAIN" ] || [ -z "$$SIGNALHUB_TLS" ]; then
          echo "Set SIGNALHUB_DOMAIN and SIGNALHUB_TLS in .env, see docs/deployment.md" >&2
          exit 1
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment:
      # The name clients use, such as signalhub.example.com.
      SIGNALHUB_DOMAIN: ${SIGNALHUB_DOMAIN:-}
      # An email address (Let's Encrypt) or "internal" (Caddy's own CA).
      SIGNALHUB_TLS: ${SIGNALHUB_TLS:-}
    ports:
      # Port 80 answers certificate challenges and redirects to HTTPS.
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates, their keys and Caddy's own CA: keep them across restarts.
      - proxy-data:/data
      - proxy-config:/config

volumes:
  postgres-data:
  proxy-data:
  proxy-config:
