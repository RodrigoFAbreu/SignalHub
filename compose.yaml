# SignalHub: backend API + PostgreSQL. See docs/development.md.
# Configuration comes from .env (copy .env.example).

name: signalhub

x-backend-image: &backend-image
  build: ./backend
  image: signalhub-backend:local

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: signalhub
      POSTGRES_DB: signalhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    # Loopback only: reachable for local development, not from the network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "--username=signalhub", "--dbname=signalhub"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # One-shot: applies pending migrations, then exits. The API starts only
  # after it succeeds, so the API never runs against an outdated schema.
  migrate:
    <<: *backend-image
    command: ["alembic", "upgrade", "head"]
    environment:
      SIGNALHUB_DATABASE_URL: postgresql+psycopg://signalhub:${POSTGRES_PASSWORD}@db:5432/signalhub
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend-image
    restart: unless-stopped
    environment:
      SIGNALHUB_DATABASE_URL: postgresql+psycopg://signalhub:${POSTGRES_PASSWORD}@db:5432/signalhub
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${SIGNALHUB_PORT:-8000}:8000"

volumes:
  db-data:
