<!doctype html>
<!--
  The admin page: the operator's devices, users, producers and events, and whether SignalHub is
  working (docs/architecture.md#the-admin-page). Plain HTML, CSS and ES modules; no framework and no
  build step. Served only on the backend's own port, never through the proxy. It is static; everything
  it does goes through the management API with the admin token typed on its sign-in screen, which
  stays in this page's memory. Its layout, tokens and wording are the approved drawings'
  (docs/design/users/source/Admin - *.dc.html).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark light" />
    <title>Admin - SignalHub</title>
    <link rel="stylesheet" href="../app/fonts/fonts.css" />
    <link rel="stylesheet" href="admin.css" />
    <script src="/webjars/qrcode-generator/2.0.4/dist/qrcode.js" defer></script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div id="live" class="sr-only" role="status" aria-live="polite"></div>
    <div id="signin"></div>

    <div id="app" class="app" hidden>
      <!-- The rail's section is the address's fragment, so a reload stays on it. -->
      <nav id="rail" class="rail" aria-label="Sections">
        <span class="rlogo"><span class="ms" aria-hidden="true">sensors</span></span>
        <span class="rcap">Admin</span>
        <a class="ri" href="#devices" data-section="devices"><span class="pill"><span class="ms" aria-hidden="true">devices</span></span>Devices</a>
        <a class="ri" href="#users" data-section="users"><span class="pill"><span class="ms" aria-hidden="true">group</span></span>Users</a>
        <a class="ri" href="#producers" data-section="producers"><span class="pill"><span class="ms" aria-hidden="true">sensors</span></span>Producers</a>
        <a class="ri" href="#events" data-section="events"><span class="pill"><span class="ms" aria-hidden="true">inbox</span></span>Events</a>
        <a class="ri" href="#status" data-section="status"><span class="pill"><span class="ms" aria-hidden="true">monitor_heart</span></span>Status</a>
        <div class="rfoot">
          <a class="ri" id="status-button" href="#status" aria-label="Server status: checking">
            <span class="pill"><span class="ms" aria-hidden="true">dns</span><span class="sdot un"></span></span><span class="word">Checking</span>
          </a>
          <button type="button" id="account" class="acct" aria-label="Account" aria-haspopup="menu" aria-expanded="false">
            <span class="av" aria-hidden="true">A</span>
          </button>
        </div>
      </nav>

      <main id="main" class="main">
        <div id="view" class="view">
          <div id="sect" class="sect"></div>
        </div>
      </main>

      <nav id="bottom-bar" class="nav" aria-label="Sections (phone)">
        <a class="ri" href="#devices" data-section="devices"><span class="pill"><span class="ms" aria-hidden="true">devices</span></span>Devices</a>
        <a class="ri" href="#users" data-section="users"><span class="pill"><span class="ms" aria-hidden="true">group</span></span>Users</a>
        <a class="ri" href="#producers" data-section="producers"><span class="pill"><span class="ms" aria-hidden="true">sensors</span></span>Producers</a>
        <a class="ri" href="#events" data-section="events"><span class="pill"><span class="ms" aria-hidden="true">inbox</span></span>Events</a>
        <a class="ri" href="#status" data-section="status"><span class="pill"><span class="ms" aria-hidden="true">monitor_heart</span></span>Status</a>
      </nav>
    </div>
  </body>
</html>
