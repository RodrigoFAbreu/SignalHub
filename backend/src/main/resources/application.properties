# SignalHub backend configuration.
#
# Profiles: `dev` (./mvnw quarkus:dev), `test` (./mvnw verify) and `prod` (the
# packaged application and the Docker image). In dev and test, Quarkus Dev
# Services starts a throwaway PostgreSQL container, so no database settings are
# needed. In prod every database setting comes from the environment and startup
# fails if one is missing. Any property can also be overridden with its standard
# Quarkus environment variable, e.g. QUARKUS_HTTP_PORT=9090.
# Never put secrets in this file.

quarkus.application.name=signalhub

# --- Database -----------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${SIGNALHUB_DB_URL}
%prod.quarkus.datasource.username=${SIGNALHUB_DB_USERNAME}
%prod.quarkus.datasource.password=${SIGNALHUB_DB_PASSWORD}
# Pin the Dev Services image so dev and test run the same PostgreSQL major
# version as compose.yaml.
quarkus.datasource.devservices.image-name=postgres:17-alpine

# --- Schema -------------------------------------------------------------------
# Flyway is the only mechanism that changes the schema. Migrations live in
# src/main/resources/db/migration and run at startup in every profile.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-migration-naming=true
# Hibernate never creates, updates, or drops tables. Set explicitly because
# Quarkus defaults to drop-and-create when Dev Services provides the database.
quarkus.hibernate-orm.schema-management.strategy=none

# --- HTTP API -------------------------------------------------------------------
# Largest accepted request body; larger ones get 413. An event is at most ~4 KiB
# of text plus 16 KiB of metadata, so this leaves headroom without letting
# pathological requests through. Quarkus would otherwise accept 10 MiB.
quarkus.http.limits.max-body-size=64K

# --- Management ------------------------------------------------------------------
# The operator's admin token for /api/v1/admin/producers and /api/v1/admin/clients
# (it may also list events) comes only from the environment variable
# SIGNALHUB_ADMIN_TOKEN (at least 32 characters). Without it the management API
# is disabled and answers 404. Producer API keys and client keys are issued
# through that API and stored only as hashes in PostgreSQL.
# Tests use a fixed, test-only token that is never valid outside the test profile.
%test.signalhub.admin.token=test-only-admin-token-0123456789abcdef

# --- Push ------------------------------------------------------------------------
# Firebase Cloud Messaging (provider `fcm`) is enabled only when
# SIGNALHUB_PUSH_FCM_CREDENTIALS_FILE names a Firebase service account key file
# (JSON). Never put the key itself here or anywhere in the repository.
# signalhub.push.fcm.api-url (default https://fcm.googleapis.com) exists so
# tests can point the provider at a local fake.
#
# Every stored event is queued for a push to every client with a push target,
# and a background thread dispatches the queue after each event, at startup,
# and every minute. Tests turn the thread off and dispatch explicitly, so no
# push reaches the test provider while another test is looking at it.
%test.signalhub.push.dispatch.background=false

# --- Health and API description -------------------------------------------------
# Liveness:  /q/health/live   (process is up; no dependency checks)
# Readiness: /q/health/ready  (includes the PostgreSQL connection check)
# OpenAPI:   /q/openapi       (describes the product API under /api/v1)
quarkus.smallrye-health.openapi.included=true
quarkus.smallrye-openapi.info-title=SignalHub API
quarkus.smallrye-openapi.info-description=Producer-agnostic personal notification platform.
# Producer metadata is bound as a Jackson ObjectNode; describe it as what it is
# on the wire, an arbitrary JSON object, rather than Jackson's Java API.
mp.openapi.schema.com.fasterxml.jackson.databind.node.ObjectNode={"name": "JsonObject", "type": "object", "additionalProperties": true, "description": "An arbitrary JSON object."}
# Drop schemas nothing references, such as Jackson's JsonNode internals.
mp.openapi.extensions.smallrye.remove-unused-schemas.enable=true
