[project]
name = "signalhub"
# Releases are versioned by git tags (see docs/development.md); this field is
# required by packaging but not used for releases.
version = "0.0.0"
description = "SignalHub backend: a producer-agnostic personal notification platform."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20,<2",
    "fastapi>=0.141.1,<0.142",
    "psycopg[binary]>=3.3,<3.4",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy>=2.1,<2.2",
    "uvicorn>=0.54,<0.55",
]

[dependency-groups]
dev = [
    "httpx2>=2.13,<3",
    "pytest>=9.1,<10",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.ruff]
# Keeps first-party import detection identical whether ruff runs from the
# repository root (as in CI) or from this directory.
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
