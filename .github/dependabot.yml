version: 2
# Routine version updates come once a month, one PR per entry below. Security
# updates (enabled in the repository settings) are not grouped and open as soon
# as an advisory affects a pinned version.
updates:
  - package-ecosystem: github-actions
    # The workflows, and the composite actions they use.
    directories:
      - /
      - /.github/actions/load-backend-images
      - /.github/actions/prepare-env
      - /.github/actions/setup-flutter
    schedule:
      interval: monthly
    groups:
      monthly:
        applies-to: version-updates
        patterns: ["*"]
    commit-message:
      prefix: ci # keeps Dependabot PR titles valid Conventional Commits
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: monthly
    groups:
      monthly:
        applies-to: version-updates
        patterns: ["*"]
    commit-message:
      prefix: build
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    groups:
      monthly:
        applies-to: version-updates
        patterns: ["*"]
    commit-message:
      prefix: build
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    groups:
      monthly:
        applies-to: version-updates
        patterns: ["*"]
    commit-message:
      prefix: build
  - package-ecosystem: pub
    directory: /client
    schedule:
      interval: monthly
    groups:
      monthly:
        applies-to: version-updates
        patterns: ["*"]
    commit-message:
      prefix: build
  # The SDK's build backend (sdk/python/pyproject.toml) and ruff, which CI
  # installs from .github/tools/requirements.txt.
  - package-ecosystem: pip
    directories:
      - /sdk/python
      - /.github/tools
    schedule:
      interval: monthly
    groups:
      monthly:
        applies-to: version-updates
        patterns: ["*"]
    commit-message:
      prefix: build
  - package-ecosystem: docker
    directory: /.github/tools/actionlint
    schedule:
      interval: monthly
    groups:
      monthly:
        applies-to: version-updates
        patterns: ["*"]
    commit-message:
      prefix: ci
  # The users' web page's browser tests (Playwright); test tooling, never shipped.
  - package-ecosystem: npm
    directory: /web-tests
    schedule:
      interval: monthly
    groups:
      monthly:
        applies-to: version-updates
        patterns: ["*"]
    commit-message:
      prefix: ci
