version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci # keeps Dependabot PR titles valid Conventional Commits
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: pub
    directory: /client
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  # The SDK's build backend (sdk/python/pyproject.toml) and ruff, which CI
  # installs from .github/tools/requirements.txt.
  - package-ecosystem: pip
    directories:
      - /sdk/python
      - /.github/tools
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: docker
    directory: /.github/tools/actionlint
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
