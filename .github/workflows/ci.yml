name: CI

# Validate every PR and main push before publishing a release from main.
# Component workflows remain reusable and individually runnable.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supersede outdated PR validation. Main runs retain their release completion gates.
concurrency:
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  title:
    if: github.event_name == 'pull_request'
    uses: RodrigoFAbreu/action-workflows/.github/workflows/pr-title.yml@main
  title-passed:
    name: Conventional Commit title
    needs: title
    if: github.event_name == 'pull_request' && always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          TITLE_RESULT: ${{ needs.title.result }}
        run: test "$TITLE_RESULT" = success
  tests:
    uses: ./.github/workflows/test.yml
  passed:
    name: CI passed
    needs: tests
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.tests.result }}
        run: test "$RESULT" = success

  release:
    needs: passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-and-publish.yml
    secrets: inherit
