name: CI

# Validate every PR and main push before publishing a release from main.
# Component workflows remain reusable through the Test entry point.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# All public entry points serialize against the same repository execution group.
# Reusable children use distinct groups so they do not wait on their own caller.
concurrency:
  group: signalhub-execution
  queue: max
  cancel-in-progress: false

jobs:
  title:
    if: github.event_name == 'pull_request'
    uses: RodrigoFAbreu/action-workflows/.github/workflows/pr-title.yml@main
  title-passed:
    name: Conventional Commit title
    needs: title
    if: github.event_name == 'pull_request' && always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          TITLE_RESULT: ${{ needs.title.result }}
        run: test "$TITLE_RESULT" = success
  tests:
    needs: title-passed
    if: ${{ !cancelled() && (needs.title-passed.result == 'success' || needs.title-passed.result == 'skipped') }}
    uses: ./.github/workflows/test.yml
  passed:
    name: CI passed
    needs: tests
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.tests.result }}
        run: test "$RESULT" = success

  release:
    needs: passed
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-and-publish.yml
    secrets: inherit
