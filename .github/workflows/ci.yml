name: CI

# Runs on every pull request. The release workflow also calls it, so the exact
# commit on main is re-validated before it is tagged.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# Supersede outdated runs for the same PR. When called by the release workflow,
# the group is unique per run and the caller serializes releases itself.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.9
      - run: ruff check .
      - run: ruff format --check .
      - name: Test release versioning
        run: python -m unittest discover --start-directory scripts/release --verbose

  workflows:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The actionlint image bundles shellcheck, so `run:` scripts are checked too.
      - run: docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
