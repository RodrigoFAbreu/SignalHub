name: CI

# Validate every PR and main push before publishing a release from main.
# Component workflows remain reusable and individually runnable.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supersede outdated PR validation. Main runs retain their release completion gates.
concurrency:
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  title:
    if: github.event_name == 'pull_request'
    uses: RodrigoFAbreu/action-workflows/.github/workflows/pr-title.yml@main
  title-passed:
    name: Conventional Commit title
    needs: title
    if: github.event_name == 'pull_request' && always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          TITLE_RESULT: ${{ needs.title.result }}
        run: test "$TITLE_RESULT" = success
  python:
    uses: ./.github/workflows/ci-python.yml
  backend:
    uses: ./.github/workflows/ci-backend.yml
  app:
    uses: ./.github/workflows/ci-app.yml
  image:
    uses: ./.github/workflows/ci-image.yml
  # It starts stacks from the images the image part built.
  containers:
    needs: image
    uses: ./.github/workflows/ci-containers.yml
    with:
      images: backend-images

  # The only check the branch protection of main requires from this workflow
  # (besides Conventional Commit title, which only a pull request has). It fails
  # unless every part succeeded, so a part that is skipped, cancelled or failed
  # never passes it. A new part is added to `needs` and to the loop below.
  passed:
    name: CI passed
    if: ${{ always() }}
    needs: [python, backend, app, image, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq --raw-output 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq --raw-output '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::These parts of CI did not succeed: $failed; see their jobs above."
            exit 1
          fi

  release:
    needs: passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
