name: CI

# Runs on every pull request. The release workflow also calls it, so the exact
# commit on main is re-validated before it is tagged.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  # The Flutter SDK the client is built with (docs/development.md, "Client").
  FLUTTER_VERSION: 3.47.5

# Supersede outdated runs for the same PR. When called by the release workflow,
# the group is unique per run and the caller serializes releases itself.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The last one is the default. 3.10 is the oldest the SDK supports
          # (sdk/python/pyproject.toml, requires-python).
          python-version: |
            3.10
            3.12
      - run: pip install --requirement .github/tools/requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Test release versioning
        run: python -m unittest discover --start-directory scripts/release --verbose
      # The device run itself stays manual (scripts/device-review/README.md).
      - name: Test the device-review script
        run: python -m unittest discover --start-directory scripts/device-review --verbose
      # Installing the SDK also checks its build and the `signalhub` command.
      - run: pip install ./sdk/python && signalhub send --help
      - name: Test the Python SDK
        run: python -m unittest discover --start-directory sdk/python/tests --top-level-directory sdk/python --verbose
      # The release attaches these files; the build checks that the wheel,
      # installed, reports the version it was built with.
      - name: Build the SDK files as the release does
        run: python scripts/release/sdk_files.py 0.0.0+ci "$RUNNER_TEMP/sdk"
      - name: Test the Python SDK on its oldest supported Python
        run: |
          python3.10 -m pip install ./sdk/python
          python3.10 -m unittest discover --start-directory sdk/python/tests --top-level-directory sdk/python
      # shellcheck comes with the runner image; the tests need curl and jq too.
      - name: Lint and test the integration examples
        run: |
          shellcheck examples/*/*.sh scripts/release/*.sh
          python -m unittest discover --start-directory examples/tests --verbose

  workflows:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The actionlint image bundles shellcheck, so `run:` scripts are checked too.
      # It is pinned in .github/tools/actionlint/Dockerfile for Dependabot.
      # The example workflow of examples/github-actions is checked with the repository's own.
      - run: docker build --quiet --tag actionlint .github/tools/actionlint
      - run: docker run --rm --volume "$PWD:/repo" --workdir /repo actionlint -color .github/workflows/*.yml examples/github-actions/*.yml

  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # Dependabot updates the Compose image only, so a new PostgreSQL version
      # fails here until the tests' images (Dev Services, Testcontainers) follow.
      - name: Check that the tests use the PostgreSQL image of Compose
        run: |
          expected=$(sed -n 's/^ *image: \(postgres:[^@]*\)@.*/\1/p' ../compose.yaml)
          test -n "$expected"
          if grep -rnoE '(image-name=|")postgres:[^"[:space:]]*' src | grep -v -e ":image-name=$expected\$" -e ":\"$expected\$"; then
            echo "::error::These PostgreSQL images differ from compose.yaml's $expected"
            exit 1
          fi
          grep -q "image-name=$expected\$" src/main/resources/application.properties
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      # Compiles, runs the tests against real PostgreSQL (Dev Services and
      # Testcontainers use the runner's Docker), checks formatting (Spotless)
      # and runs static analysis (SpotBugs).
      - run: ./mvnw --batch-mode --no-transfer-progress verify

  client:
    name: Client (analyze + test + Android build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Flutter
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics && flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: shellcheck icon/render.sh
      - run: flutter test
      # Without Firebase options the app builds and runs without push, so no
      # credentials are needed here.
      - run: flutter build apk --debug

  client-ios:
    name: Client (iOS build)
    runs-on: macos-15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - name: Install Flutter
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics && flutter --version
      - run: flutter pub get --enforce-lockfile
      # Compiles the app and its native plugins for devices; signing needs the
      # owner's Apple account and happens on their machine.
      - run: flutter build ios --debug --no-codesign

  # Runs natively on x86-64 and on ARM64 (such as a Raspberry Pi 5), so the
  # image is built and the whole stack is checked on both. The x86-64 job keeps
  # its name, which branch protection requires.
  compose:
    name: ${{ matrix.arch == 'arm64' && 'Backend container (Compose smoke test, ARM64)' || 'Backend container (Compose smoke test)' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Start PostgreSQL and the backend
        run: |
          cp .env.example .env
          admin_token=$(openssl rand -hex 32)
          echo "::add-mask::$admin_token"
          echo "ADMIN_TOKEN=$admin_token" >> "$GITHUB_ENV"
          sed -i "s/^SIGNALHUB_ADMIN_TOKEN=.*/SIGNALHUB_ADMIN_TOKEN=$admin_token/" .env
          # The TLS reverse proxy of docs/deployment.md, with Caddy's own CA.
          printf '%s\n' COMPOSE_PROFILES=proxy SIGNALHUB_DOMAIN=localhost SIGNALHUB_TLS=internal >> .env
          # The resource limits recommended in docs/architecture.md#resources.
          cat > compose.override.yaml <<'YAML'
          services:
            backend:
              mem_limit: 512m
              cpus: 1
            postgres:
              mem_limit: 256m
          YAML
          docker compose up --build --wait --wait-timeout 180
          test "$(docker inspect --format '{{.HostConfig.Memory}}' "$(docker compose ps --quiet backend)")" = 536870912
      - name: The images are built for the runner's architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          for service in backend postgres proxy; do
            image=$(docker inspect --format '{{.Image}}' "$(docker compose ps --quiet "$service")")
            arch=$(docker image inspect --format '{{.Architecture}}' "$image")
            echo "$service: $arch"
            test "$arch" = "$ARCH" || { echo "expected $ARCH, got $arch"; exit 1; }
          done
      - name: Liveness, readiness and OpenAPI respond
        run: |
          curl --fail --silent --show-error http://localhost:8080/q/health/live
          curl --fail --silent --show-error http://localhost:8080/q/health/ready
          curl --fail --silent --show-error --output /dev/null http://localhost:8080/q/openapi
      # Compose builds from source, not as the release does, so the image is not a release.
      - name: An image built from source reports a development version
        run: |
          curl --fail --silent --show-error http://localhost:8080/q/info | tee /dev/stderr |
            jq --exit-status '.signalhub == {"version": "development"}'
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' signalhub-backend:local)" = development
      - name: Register a producer through the management API
        run: |
          created=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $ADMIN_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"name": "ci-smoke-test"}' \
            http://localhost:8080/api/v1/admin/producers)
          api_key=$(jq --raw-output .apiKey <<<"$created")
          echo "::add-mask::$api_key"
          {
            echo "API_KEY=$api_key"
            echo "PRODUCER_ID=$(jq --raw-output .producer.id <<<"$created")"
            echo "KEY_ID=$(jq --raw-output .keyId <<<"$created")"
          } >> "$GITHUB_ENV"
      - name: Publishing without a valid key is rejected
        run: |
          publish_status() {
            curl --silent --output /dev/null --write-out '%{http_code}' "$@" \
              --header 'Content-Type: application/json' \
              --data '{"category": "INFO", "severity": "LOW", "title": "Rejected"}' \
              http://localhost:8080/api/v1/events
          }
          test "$(publish_status)" = 401
          test "$(publish_status --header 'Authorization: Bearer shpk1_not-a-key')" = 401
          test "$(publish_status --header "Authorization: Bearer $ADMIN_TOKEN")" = 401
      - name: A published event survives a backend restart
        run: |
          id=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $API_KEY" \
            --header 'Content-Type: application/json' \
            --data '{"category": "INFO", "severity": "LOW", "title": "Smoke test", "metadata": {"check": "restart"}}' \
            http://localhost:8080/api/v1/events | jq --raw-output .id)
          echo "created event $id"
          docker compose restart backend
          docker compose up --wait --wait-timeout 120
          curl --fail --silent --show-error --header "Authorization: Bearer $ADMIN_TOKEN" \
            "http://localhost:8080/api/v1/events/$id" \
            | jq --exit-status '.title == "Smoke test" and .metadata.check == "restart"
                and .producer.name == "ci-smoke-test" and .producer.id == env.PRODUCER_ID'
          # Reading an event needs the owner's credential, not only its ID.
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "http://localhost:8080/api/v1/events/$id")
          test "$status" = 401 || { echo "expected 401, got $status"; exit 1; }
      - name: The owner lists the event with the admin token
        run: |
          curl --fail --silent --show-error --get \
            --header "Authorization: Bearer $ADMIN_TOKEN" \
            --data-urlencode "producerId=$PRODUCER_ID" --data-urlencode 'limit=10' \
            http://localhost:8080/api/v1/events \
            | jq --exit-status '(.items | length) == 1 and .items[0].title == "Smoke test"
                and .nextCursor == null'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://localhost:8080/api/v1/events)
          test "$status" = 401 || { echo "expected 401, got $status"; exit 1; }
      - name: Other machines reach only the product API, over TLS through the proxy
        run: |
          docker compose exec -T proxy cat /data/caddy/pki/authorities/local/root.crt > "$RUNNER_TEMP/proxy-ca.crt"
          https_status() {
            curl --silent --path-as-is --cacert "$RUNNER_TEMP/proxy-ca.crt" --output /dev/null \
              --write-out '%{http_code}' --header "Authorization: Bearer $ADMIN_TOKEN" "https://localhost$1"
          }
          curl --fail --silent --show-error --cacert "$RUNNER_TEMP/proxy-ca.crt" \
            --retry 10 --retry-delay 1 --retry-all-errors \
            --header "Authorization: Bearer $ADMIN_TOKEN" https://localhost/api/v1/events \
            | jq --exit-status '.items[0].title == "Smoke test"'
          # Publishing reaches the backend, which checks the key (no event is stored,
          # so the listings below still see only "Smoke test").
          status=$(curl --silent --cacert "$RUNNER_TEMP/proxy-ca.crt" --output /dev/null \
            --write-out '%{http_code}' --header 'Content-Type: application/json' \
            --data '{"category": "INFO", "severity": "LOW", "title": "Rejected"}' \
            https://localhost/api/v1/events)
          test "$status" = 401 || { echo "expected 401, got $status"; exit 1; }
          # Management, health, metrics and OpenAPI stay on the host, however the path is spelled.
          for path in /api/v1/admin/producers /api//v1/admin/producers /api/v1/%61dmin/producers \
              /api/v1/events/../admin/producers /api/%2e%2e/q/metrics /q/health/ready /q/metrics \
              /q/openapi /; do
            status=$(https_status "$path")
            test "$status" = 404 || { echo "$path: expected 404, got $status"; exit 1; }
          done
          # Plain HTTP only redirects to HTTPS.
          test "$(curl --silent --output /dev/null --write-out '%{http_code} %{redirect_url}' \
            http://localhost/api/v1/events)" = '308 https://localhost/api/v1/events'
      - name: A registered client lists events, marks them read and sets its push target and preferences
        run: |
          created=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $ADMIN_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"name": "ci-smoke-client"}' \
            http://localhost:8080/api/v1/admin/clients)
          client_key=$(jq --raw-output .clientKey <<<"$created")
          client_id=$(jq --raw-output .client.id <<<"$created")
          echo "::add-mask::$client_key"
          curl --fail --silent --show-error --get \
            --header "Authorization: Bearer $client_key" \
            --data-urlencode "producerId=$PRODUCER_ID" \
            http://localhost:8080/api/v1/events \
            | jq --exit-status '.items[0].title == "Smoke test" and .items[0].readAt == null'
          newest=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $client_key" \
            "http://localhost:8080/api/v1/events?limit=1" | jq --raw-output '.items[0].id')
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $client_key" \
            --header 'Content-Type: application/json' \
            --data "{\"through\": \"$newest\"}" \
            http://localhost:8080/api/v1/events/read \
            | jq --exit-status '.marked >= 1'
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $client_key" \
            http://localhost:8080/api/v1/events/unread-count \
            | jq --exit-status '.unread == 0'
          curl --fail --silent --show-error --request PUT \
            --header "Authorization: Bearer $client_key" \
            --header 'Content-Type: application/json' \
            --data '{"provider": "fcm", "token": "ci-smoke-token"}' \
            http://localhost:8080/api/v1/client/push-target \
            | jq --exit-status '.pushTarget.provider == "fcm" and (.pushTarget | has("token") | not)'
          curl --fail --silent --show-error --request PUT \
            --header "Authorization: Bearer $client_key" \
            --header 'Content-Type: application/json' \
            --data '{"minimumSeverity": "HIGH", "mutedCategories": ["INFO"]}' \
            http://localhost:8080/api/v1/client/push-preferences \
            | jq --exit-status '.pushPreferences == {"enabled": true, "minimumSeverity": "HIGH",
                "mutedCategories": ["INFO"], "mutedProducerIds": []}'
          curl --fail --silent --show-error --output /dev/null --request POST \
            --header "Authorization: Bearer $ADMIN_TOKEN" \
            "http://localhost:8080/api/v1/admin/clients/$client_id/revoke"
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $client_key" http://localhost:8080/api/v1/events)
          test "$status" = 401 || { echo "expected 401, got $status"; exit 1; }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # After the listings above, which expect only the "Smoke test" event.
      - name: The Python command publishes an event
        env:
          SIGNALHUB_URL: http://localhost:8080
        run: |
          pip install ./sdk/python
          id=$(SIGNALHUB_API_KEY=$API_KEY signalhub send --category action-required \
            --severity HIGH --title "From the command" --context ci/sdk \
            --metadata '{"run": 42}' --meta step=smoke)
          curl --fail --silent --show-error --header "Authorization: Bearer $ADMIN_TOKEN" \
            "http://localhost:8080/api/v1/events/$id" \
            | jq --exit-status '.category == "ACTION_REQUIRED" and .title == "From the command"
                and .metadata == {"run": 42, "step": "smoke"} and .producer.id == env.PRODUCER_ID'
          status=0
          SIGNALHUB_API_KEY=shpk1_not-a-key signalhub send --category INFO --severity LOW \
            --title Rejected || status=$?
          test "$status" = 1 || { echo "expected exit status 1, got $status"; exit 1; }
      - name: Metrics count the events published since the restart
        run: |
          metrics=$(curl --fail --silent --show-error --header 'Accept: text/plain' \
            http://localhost:8080/q/metrics)
          # Only the Python command's event was stored after the restart; rejected ones do not count.
          grep --quiet '^signalhub_events_published_total 1.0$' <<<"$metrics"
          grep --quiet '^signalhub_push_dispatch_pending ' <<<"$metrics"
          grep --quiet '^agroal_active_count' <<<"$metrics"
          grep --quiet '^http_server_requests_seconds_count{.*uri="/api/v1/events/{id}"' <<<"$metrics"
      - name: JSON logs carry the startup summary and no secrets
        run: |
          echo 'SIGNALHUB_LOG_JSON=true' >> .env
          echo 'SIGNALHUB_EVENTS_RETENTION=400d' >> .env
          docker compose up --wait --wait-timeout 120   # recreates the backend
          logs=$(docker compose logs --no-log-prefix backend)
          db_password=$(sed -n 's/^SIGNALHUB_DB_PASSWORD=//p' .env)
          # Every line is a JSON object: jq fails on the first one that is not.
          jq --raw-input 'fromjson | .message' <<<"$logs" > /dev/null
          summary=$(jq --raw-input --raw-output \
            'fromjson | select(.loggerName | endswith(".StartupDiagnostics")) | .message' <<<"$logs")
          echo "$summary"
          grep --quiet '^SignalHub development build; Configuration: profile prod; database jdbc:postgresql://postgres:5432/signalhub as signalhub; management API enabled; .*event retention 400d; JSON logs on' <<<"$summary"
          if grep --quiet --fixed-strings --regexp="$ADMIN_TOKEN" --regexp="$db_password" <<<"$logs"; then
            echo "a secret reached the logs"; exit 1
          fi
      # The commands of docs/architecture.md#backup-and-restore.
      - name: A backup restores into an empty database
        run: |
          backup="$RUNNER_TEMP/signalhub.dump"
          docker compose exec -T postgres sh -c \
            'pg_dump --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --format=custom' \
            > "$backup"
          docker compose exec -T postgres pg_restore --list < "$backup" > /dev/null
          publish() {
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $API_KEY" \
              --header 'Content-Type: application/json' \
              --data "{\"category\": \"INFO\", \"severity\": \"LOW\", \"title\": \"$1\"}" \
              http://localhost:8080/api/v1/events | jq --raw-output .id
          }
          later=$(publish "After the backup")
          # Only the database volume: the proxy keeps its certificates and CA.
          docker compose down
          docker volume rm signalhub_postgres-data
          docker compose up --wait --wait-timeout 120 postgres
          restore() {
            docker compose exec -T postgres sh -c \
              'pg_restore --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-owner --no-privileges --exit-on-error --single-transaction' \
              < "$backup"
          }
          restore
          docker compose up --wait --wait-timeout 120
          # Events from before the backup are back, with their read state; later ones are gone.
          curl --fail --silent --show-error --get \
            --header "Authorization: Bearer $ADMIN_TOKEN" \
            --data-urlencode "producerId=$PRODUCER_ID" \
            http://localhost:8080/api/v1/events \
            | jq --exit-status '[.items[].title] == ["From the command", "Smoke test"]
                and .items[1].readAt != null'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $ADMIN_TOKEN" "http://localhost:8080/api/v1/events/$later")
          test "$status" = 404 || { echo "expected 404, got $status"; exit 1; }
          # The producer's key still works: the backup holds its hash.
          publish "After the restore" > /dev/null
          # Restoring over existing data fails and changes nothing.
          if restore 2> /dev/null; then echo "restored over existing data"; exit 1; fi
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ADMIN_TOKEN" \
            http://localhost:8080/api/v1/events/unread-count \
            | jq --exit-status '.unread == 2'
          docker compose exec -T proxy cat /data/caddy/pki/authorities/local/root.crt \
            | cmp - "$RUNNER_TEMP/proxy-ca.crt"
      # Unrelated producers, each with its own key, through the same contract.
      - name: The integration examples publish through the public API
        env:
          SIGNALHUB_URL: http://localhost:8080
        run: |
          # Sets SIGNALHUB_API_KEY to the key of a new producer.
          register() {
            SIGNALHUB_API_KEY=$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $ADMIN_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "{\"name\": \"$1\"}" \
              http://localhost:8080/api/v1/admin/producers | jq --raw-output .apiKey)
            echo "::add-mask::$SIGNALHUB_API_KEY"
            export SIGNALHUB_API_KEY
          }
          register example-shell
          examples/shell/run-and-notify.sh "Example job" true 2> "$RUNNER_TEMP/errors.log"
          register example-disk-usage
          examples/disk-usage/check-disk-usage.sh / 0 2>> "$RUNNER_TEMP/errors.log"
          register example-agent
          echo '{"hook_event_name": "Notification", "cwd": "/work/example", "message": "Waiting for approval"}' \
            | python examples/coding-agent/agent_hook.py 2>> "$RUNNER_TEMP/errors.log"
          register example-usage
          python examples/usage-threshold/usage_threshold.py \
            --name "Example quota" --used 95 --limit 100 2>> "$RUNNER_TEMP/errors.log"
          # The workflow's step, run twice for one run attempt as a retry would:
          # its idempotency key stores the event once.
          register example-github
          sed -n '/^        run: |$/,$p' examples/github-actions/notify-on-failure.yml \
            | tail -n +2 | sed 's/^          //' > "$RUNNER_TEMP/notify-step.sh"
          for _ in 1 2; do
            REPOSITORY=owner/repo WORKFLOW=CI BRANCH=main COMMIT=0123456789abcdef \
              RUN_URL=https://github.com/owner/repo/actions/runs/7 RUN_NUMBER=3 \
              RUN_ID=7 RUN_ATTEMPT=1 bash -eo pipefail "$RUNNER_TEMP/notify-step.sh" > /dev/null
          done
          # The shell and agent examples report a failed publish without failing.
          if test -s "$RUNNER_TEMP/errors.log"; then cat "$RUNNER_TEMP/errors.log"; exit 1; fi
          curl --fail --silent --show-error --get \
            --header "Authorization: Bearer $ADMIN_TOKEN" --data limit=5 \
            http://localhost:8080/api/v1/events \
            | jq --exit-status '[.items[] | [.producer.name, .category]] == [
                ["example-github", "BLOCKED"],
                ["example-usage", "ACTION_REQUIRED"], ["example-agent", "ACTION_REQUIRED"],
                ["example-disk-usage", "ACTION_REQUIRED"], ["example-shell", "COMPLETED"]]'
      - name: A revoked key no longer authenticates
        run: |
          curl --fail --silent --show-error --output /dev/null --request POST \
            --header "Authorization: Bearer $ADMIN_TOKEN" \
            "http://localhost:8080/api/v1/admin/producers/$PRODUCER_ID/keys/$KEY_ID/revoke"
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $API_KEY" \
            --header 'Content-Type: application/json' \
            --data '{"category": "INFO", "severity": "LOW", "title": "Revoked"}' \
            http://localhost:8080/api/v1/events)
          test "$status" = 401 || { echo "expected 401, got $status"; exit 1; }
      - name: Readiness reports DOWN while PostgreSQL is stopped
        run: |
          docker compose stop postgres
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/q/health/ready)
          test "$status" = 503 || { echo "expected 503, got $status"; exit 1; }
          curl --fail --silent --show-error http://localhost:8080/q/health/live
          docker compose start postgres
          docker compose up --wait --wait-timeout 120
      - name: The backend refuses a database that a newer release migrated
        run: |
          sql() {
            docker compose exec -T postgres sh -c \
              'psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --set ON_ERROR_STOP=1 --tuples-only --no-align' \
              <<<"$1"
          }
          docker compose stop backend
          sql "INSERT INTO flyway_schema_history
                     (installed_rank, version, description, type, script, checksum, installed_by, execution_time, success)
                   SELECT max(installed_rank) + 1, '99999', 'from a newer release', 'SQL',
                     'V99999__from_a_newer_release.sql', 0, current_user, 0, true
                   FROM flyway_schema_history"
          before=$(sql "SELECT count(*) FROM flyway_schema_history")
          code=0
          timeout 120 docker compose run --rm --no-deps backend > "$RUNNER_TEMP/newer-schema.log" 2>&1 || code=$?
          test "$code" != 124 || { echo "still running after 120s"; exit 1; }
          test "$code" != 0 || { echo "started on a newer schema"; exit 1; }
          grep 'migrations 99999 are unknown to this release' "$RUNNER_TEMP/newer-schema.log"
          test "$(sql "SELECT count(*) FROM flyway_schema_history")" = "$before"
          sql "DELETE FROM flyway_schema_history WHERE version = '99999'"
          docker compose up --wait --wait-timeout 120
      - name: The image refuses to start without database settings
        run: |
          docker run --detach --name no-database signalhub-backend:local
          code=$(timeout 60 docker wait no-database) || { echo "still running after 60s"; exit 1; }
          docker logs no-database 2>&1 | grep 'No database configured'
          test "$code" != 0
      - if: always()
        run: docker stats --no-stream
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes

  # The release's build of the backend image (scripts/release/build-image.sh), on
  # each platform it publishes, with a test version; the release runs the same
  # checks on the images it pushed.
  image:
    name: ${{ matrix.arch == 'arm64' && 'Backend image (release build, ARM64)' || 'Backend image (release build)' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the image as the release does
        run: scripts/release/build-image.sh 0.0.0-ci "$GITHUB_SHA" load
      - name: The image reports the version and commit it was built with
        run: scripts/release/check-image.sh signalhub-backend:check 0.0.0-ci "$GITHUB_SHA"

  # The upgrade and rollback of docs/deployment.md#upgrades: a stack of an
  # earlier release, with data, upgraded in place to this commit's deployment
  # files and rolled back to the release again by restoring a backup. From the
  # latest release, and from the oldest one docs/deployment.md#upgrades says is
  # tested, which skips every release and migration in between. The image CI
  # builds for this commit stands in for the one its release will publish.
  upgrade:
    name: Backend container (upgrade from ${{ matrix.from }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - from: the latest release
          # The oldest release that stores every kind of data this job
          # checks: events, producer keys, clients, read state and push
          # preferences.
          - from: v0.13.0
            release: v0.13.0
    env:
      IMAGE: ghcr.io/rodrigofabreu/signalhub
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release tags
      - name: Start ${{ matrix.from }}
        env:
          RELEASE: ${{ matrix.release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Otherwise the newest release before this commit (HEAD^ is main's tip on a pull request).
          previous=${RELEASE:-$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD^)}
          echo "upgrading from $previous"
          current=$(git rev-parse HEAD)
          install=$RUNNER_TEMP/signalhub
          mkdir "$install"
          admin_token=$(openssl rand -hex 32)
          echo "::add-mask::$admin_token"
          cp .env.example "$install/.env"
          sed -i "s/^SIGNALHUB_ADMIN_TOKEN=.*/SIGNALHUB_ADMIN_TOKEN=$admin_token/" "$install/.env"
          # The checkout's compose commands (logs, clean-up) need the settings too.
          cp "$install/.env" .env
          # Releases that attach their deployment files are installed from them,
          # as docs/deployment.md#setup says; older ones from their tag.
          archive=signalhub-${previous#v}-deployment.tar.gz
          if gh release view "$previous" --json assets --jq '.assets[].name' | grep --quiet --line-regexp --fixed-strings "$archive"; then
            gh release download "$previous" --pattern "$archive" --dir "$RUNNER_TEMP"
            tar --extract --file "$RUNNER_TEMP/$archive" --directory "$install"
            previous_dir=$install
          else
            archive=
            previous_dir=$GITHUB_WORKSPACE
            git checkout --quiet "$previous"
            # With its published image if it has one (releases since R20 of
            # docs/roadmap.md); Compose builds the missing image otherwise.
            if docker pull "$IMAGE:${previous#v}"; then
              docker tag "$IMAGE:${previous#v}" signalhub-backend:local
            fi
          fi
          {
            echo "PREVIOUS=$previous"
            echo "PREVIOUS_ARCHIVE=$archive"
            echo "PREVIOUS_DIR=$previous_dir"
            echo "CURRENT=$current"
            echo "INSTALL=$install"
            echo "ADMIN_TOKEN=$admin_token"
          } >> "$GITHUB_ENV"
          cd "$previous_dir"
          docker compose up --wait --wait-timeout 180
      - name: Store a producer, a client and a read event
        run: |
          created=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $ADMIN_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"name": "ci-upgrade-test"}' \
            http://localhost:8080/api/v1/admin/producers)
          api_key=$(jq --raw-output .apiKey <<<"$created")
          echo "::add-mask::$api_key"
          created=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $ADMIN_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"name": "ci-upgrade-client"}' \
            http://localhost:8080/api/v1/admin/clients)
          client_key=$(jq --raw-output .clientKey <<<"$created")
          echo "::add-mask::$client_key"
          {
            echo "API_KEY=$api_key"
            echo "CLIENT_KEY=$client_key"
          } >> "$GITHUB_ENV"
          id=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $api_key" \
            --header 'Content-Type: application/json' \
            --data '{"category": "INFO", "severity": "LOW", "title": "Before the upgrade", "metadata": {"release": "previous"}}' \
            http://localhost:8080/api/v1/events | jq --raw-output .id)
          curl --fail --silent --show-error --output /dev/null --request PUT \
            --header "Authorization: Bearer $client_key" \
            "http://localhost:8080/api/v1/events/$id/read"
          curl --fail --silent --show-error --output /dev/null --request PUT \
            --header "Authorization: Bearer $client_key" \
            --header 'Content-Type: application/json' \
            --data '{"minimumSeverity": "HIGH"}' \
            http://localhost:8080/api/v1/client/push-preferences
      - name: Back up and upgrade to this commit's deployment files
        run: |
          docker compose exec -T postgres sh -c \
            'pg_dump --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --format=custom' \
            > "$RUNNER_TEMP/signalhub.dump"
          git checkout --quiet "$CURRENT"
          # What the release of this commit would publish and attach.
          scripts/release/build-image.sh 0.0.0-ci "$CURRENT" load
          python3 scripts/release/deployment_files.py signalhub-backend:check 0.0.0-ci "$RUNNER_TEMP"
          # As docs/deployment.md#upgrades: the new files over the old ones, or
          # beside the .env of an install from a checkout; .env stays.
          tar --extract --file "$RUNNER_TEMP/signalhub-0.0.0-ci-deployment.tar.gz" --directory "$INSTALL"
          cd "$INSTALL"
          docker compose up --wait --wait-timeout 180
          docker compose ps --format '{{.Service}}: {{.Health}}' | sort | tee "$RUNNER_TEMP/health"
          test "$(cat "$RUNNER_TEMP/health")" = "$(printf 'backend: healthy\npostgres: healthy')"
          # Nothing was built: the backend runs the image of the deployment files.
          test "$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps --quiet backend)")" = signalhub-backend:check
          curl --fail --silent --show-error http://localhost:8080/q/info \
            | jq --exit-status '.signalhub.version == "0.0.0-ci" and .signalhub.revision == env.CURRENT'
      - name: The data and keys of the release survive the upgrade
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLIENT_KEY" \
            http://localhost:8080/api/v1/events \
            | jq --exit-status '(.items | length) == 1 and .items[0].title == "Before the upgrade"
                and .items[0].metadata.release == "previous" and .items[0].readAt != null'
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLIENT_KEY" \
            http://localhost:8080/api/v1/client \
            | jq --exit-status '.pushPreferences.minimumSeverity == "HIGH"'
          curl --fail --silent --show-error --output /dev/null \
            --header "Authorization: Bearer $API_KEY" \
            --header 'Content-Type: application/json' \
            --data '{"category": "INFO", "severity": "LOW", "title": "After the upgrade"}' \
            http://localhost:8080/api/v1/events
          # Every migration of this commit is applied, and none failed.
          migrations=$(find backend/src/main/resources/db/migration -name 'V*__*.sql' | wc -l)
          docker compose exec -T postgres sh -c \
            'psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --tuples-only --no-align --command "SELECT count(*) FILTER (WHERE success), count(*) FILTER (WHERE NOT success) FROM flyway_schema_history WHERE version IS NOT NULL"' \
            | tee "$RUNNER_TEMP/migrations"
          test "$(cat "$RUNNER_TEMP/migrations")" = "$migrations|0"
      - name: Rolling back to the release restores its backup
        run: |
          # The release's own deployment files, or its tag.
          up=(up --wait --wait-timeout 180)
          if [ -n "$PREVIOUS_ARCHIVE" ]; then
            tar --extract --file "$RUNNER_TEMP/$PREVIOUS_ARCHIVE" --directory "$INSTALL"
          else
            git checkout --quiet "$PREVIOUS"
            up+=(--build)
          fi
          cd "$PREVIOUS_DIR"
          docker compose down
          docker volume rm signalhub_postgres-data
          docker compose up --wait --wait-timeout 120 postgres
          docker compose exec -T postgres sh -c \
            'pg_restore --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-owner --no-privileges --exit-on-error --single-transaction' \
            < "$RUNNER_TEMP/signalhub.dump"
          docker compose "${up[@]}"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLIENT_KEY" \
            http://localhost:8080/api/v1/events \
            | jq --exit-status '[.items[].title] == ["Before the upgrade"]'
          cd "$GITHUB_WORKSPACE"
          git checkout --quiet "$CURRENT"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes

  e2e:
    name: End-to-end (producer to push and client inbox)
    runs-on: ubuntu-latest
    env:
      SIGNALHUB_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ./sdk/python
      - name: Start a fake FCM, PostgreSQL and the backend with FCM push enabled
        run: |
          echo "SENDS=$RUNNER_TEMP/fcm-sends.jsonl" >> "$GITHUB_ENV"
          python scripts/e2e/fake_fcm.py --port 8099 --record "$RUNNER_TEMP/fcm-sends.jsonl" \
            > "$RUNNER_TEMP/fake-fcm.log" 2>&1 &
          # A throwaway service account key that only the fake accepts; no real
          # Firebase credential is ever needed in CI.
          openssl genpkey -quiet -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/fcm-key.pem"
          jq --null-input --rawfile key "$RUNNER_TEMP/fcm-key.pem" '{
              type: "service_account", project_id: "signalhub-e2e", private_key_id: "e2e",
              private_key: $key, client_email: "signalhub@signalhub-e2e.iam.gserviceaccount.com",
              token_uri: "http://host.docker.internal:8099/token"}' > "$RUNNER_TEMP/fcm.json"
          chmod a+r "$RUNNER_TEMP/fcm.json" # the backend runs as UID 10001
          cp .env.example .env
          admin_token=$(openssl rand -hex 32)
          echo "::add-mask::$admin_token"
          echo "ADMIN_TOKEN=$admin_token" >> "$GITHUB_ENV"
          sed -i "s/^SIGNALHUB_ADMIN_TOKEN=.*/SIGNALHUB_ADMIN_TOKEN=$admin_token/" .env
          # The key mount of docs/development.md#firebase-cloud-messaging, with the
          # FCM API pointed at the fake on the runner.
          cat > compose.override.yaml <<YAML
          services:
            backend:
              environment:
                SIGNALHUB_PUSH_FCM_CREDENTIALS_FILE: /run/secrets/fcm.json
                SIGNALHUB_PUSH_FCM_API_URL: http://host.docker.internal:8099
              volumes:
                - $RUNNER_TEMP/fcm.json:/run/secrets/fcm.json:ro
              extra_hosts:
                - host.docker.internal:host-gateway
          YAML
          docker compose up --build --wait --wait-timeout 180
          grep --quiet 'Push providers: \[fcm\]' <<<"$(docker compose logs backend)"
      - name: Register a producer and two clients with push targets
        run: |
          admin() {
            curl --fail --silent --show-error --header "Authorization: Bearer $ADMIN_TOKEN" \
              --header 'Content-Type: application/json' --data "$2" "$SIGNALHUB_URL$1"
          }
          register_client() { # name, push token; prints the client key
            local key
            key=$(admin /api/v1/admin/clients "{\"name\": \"$1\"}" | jq --raw-output .clientKey)
            curl --fail --silent --show-error --output /dev/null --request PUT \
              --header "Authorization: Bearer $key" --header 'Content-Type: application/json' \
              --data "{\"provider\": \"fcm\", \"token\": \"$2\"}" \
              "$SIGNALHUB_URL/api/v1/client/push-target"
            echo "$key"
          }
          api_key=$(admin /api/v1/admin/producers '{"name": "e2e-producer"}' | jq --raw-output .apiKey)
          echo "::add-mask::$api_key"
          phone_key=$(register_client e2e-phone e2e-phone-token)
          # Its app was uninstalled: FCM answers UNREGISTERED for this token.
          stale_key=$(register_client e2e-stale unregistered-e2e-token)
          echo "::add-mask::$phone_key"
          echo "::add-mask::$stale_key"
          curl --fail --silent --show-error --output /dev/null --request PUT \
            --header "Authorization: Bearer $phone_key" --header 'Content-Type: application/json' \
            --data '{"minimumSeverity": "HIGH"}' "$SIGNALHUB_URL/api/v1/client/push-preferences"
          {
            echo "SIGNALHUB_API_KEY=$api_key"
            echo "PHONE_KEY=$phone_key"
            echo "STALE_KEY=$stale_key"
          } >> "$GITHUB_ENV"
      - name: The producer publishes a low and a high severity event
        run: |
          low=$(signalhub send --category INFO --severity LOW --title "Nightly backup finished")
          high=$(signalhub send --category ACTION_REQUIRED --severity HIGH \
            --title "Approve the deployment" --message "Production is waiting." --meta run=7)
          {
            echo "LOW_ID=$low"
            echo "HIGH_ID=$high"
          } >> "$GITHUB_ENV"
      - name: Push goes out through FCM as the clients' preferences allow
        run: |
          stale_target() {
            curl --fail --silent --show-error --header "Authorization: Bearer $STALE_KEY" \
              "$SIGNALHUB_URL/api/v1/client" | jq --compact-output .pushTarget
          }
          # Both events are dispatched in order, so once the high one reached the
          # phone and the stale target is gone, the low one was already handled.
          for _ in $(seq 60); do
            if jq --exit-status --slurp 'any(.[]; .message.data.eventId == env.HIGH_ID
                  and .message.token == "e2e-phone-token")' "$SENDS" > /dev/null \
                && [ "$(stale_target)" = null ]; then
              break
            fi
            sleep 1
          done
          cat "$SENDS"
          # The phone gets only the high severity event, as FCM's HTTP v1 API expects it.
          jq --exit-status --slurp '[.[] | select(.message.token == "e2e-phone-token")]
              == [{"path": "/v1/projects/signalhub-e2e/messages:send",
                   "message": {"token": "e2e-phone-token",
                     "notification": {"title": "Approve the deployment", "body": "Production is waiting."},
                     "data": {"eventId": env.HIGH_ID, "category": "ACTION_REQUIRED", "severity": "HIGH"}}}]' \
            "$SENDS"
          # FCM's UNREGISTERED removed the stale client's target.
          jq --exit-status --slurp 'any(.[]; .message.token == "unregistered-e2e-token"
              and .message.data.eventId == env.LOW_ID)' "$SENDS"
          test "$(stale_target)" = null
          metrics=$(curl --fail --silent --show-error --header 'Accept: text/plain' \
            "$SIGNALHUB_URL/q/metrics")
          grep --quiet --extended-regexp '^signalhub_push_deliveries_total\{result="delivered",?\} 1\.0$' <<<"$metrics"
          grep --quiet --extended-regexp '^signalhub_push_deliveries_total\{result="invalid_target",?\} 1\.0$' <<<"$metrics"
      - name: The client opens the pushed event from its inbox and reads it
        run: |
          client() {
            curl --fail --silent --show-error --header "Authorization: Bearer $PHONE_KEY" "$@"
          }
          pushed=$(jq --raw-output --slurp \
            '.[] | select(.message.token == "e2e-phone-token") | .message.data.eventId' "$SENDS")
          client "$SIGNALHUB_URL/api/v1/events/$pushed" \
            | jq --exit-status '.title == "Approve the deployment" and .metadata == {"run": "7"}
                and .producer.name == "e2e-producer" and .readAt == null'
          # The inbox holds every event, pushed or not, newest first.
          client "$SIGNALHUB_URL/api/v1/events" \
            | jq --exit-status '[.items[].id] == [env.HIGH_ID, env.LOW_ID]
                and all(.items[]; .readAt == null)'
          client "$SIGNALHUB_URL/api/v1/events/unread-count" | jq --exit-status '.unread == 2'
          client --request PUT "$SIGNALHUB_URL/api/v1/events/$pushed/read" \
            | jq --exit-status '.readAt != null'
          client "$SIGNALHUB_URL/api/v1/events/unread-count" | jq --exit-status '.unread == 1'
      - if: failure()
        run: |
          docker compose logs
          cat "$RUNNER_TEMP/fake-fcm.log"
      - if: always()
        run: docker compose down --volumes

  # A fresh install that follows docs/deployment.md#setup to the letter, from
  # a release's deployment files, with the FCM key and resource limits it
  # points to, then the tightest secret setup and a restart of Docker, as after
  # a host reboot. The image CI builds for this commit, and the deployment
  # files naming it, stand in for what its release will publish and attach.
  fresh-install:
    name: Deployment (fresh install from docs/deployment.md)
    runs-on: ubuntu-latest
    env:
      DOMAIN: signalhub.home.arpa
      SIGNALHUB_URL: https://signalhub.home.arpa
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ./sdk/python
      - name: Build what the release publishes and attaches
        run: |
          scripts/release/build-image.sh 0.0.0-ci "$GITHUB_SHA" load
          mkdir "$RUNNER_TEMP/release"
          python scripts/release/deployment_files.py signalhub-backend:check 0.0.0-ci "$RUNNER_TEMP/release"
          (cd "$RUNNER_TEMP/release" && sha256sum signalhub-0.0.0-ci-deployment.tar.gz > SHA256SUMS)
      - name: Get the deployment files as documented
        run: |
          mkdir "$RUNNER_TEMP/signalhub"
          cd "$RUNNER_TEMP/signalhub"
          # Stands in for the download from the release.
          cp "$RUNNER_TEMP"/release/* .
          sha256sum --check --ignore-missing SHA256SUMS
          tar --extract --file signalhub-0.0.0-ci-deployment.tar.gz
      - name: Set up .env, the FCM key and the resource limits as documented
        working-directory: ${{ runner.temp }}/signalhub
        run: |
          # The name clients use resolves to this host.
          echo "127.0.0.1 $DOMAIN" | sudo tee --append /etc/hosts
          cp .env.example .env
          chmod 600 .env
          db_password=$(openssl rand -hex 24)
          admin_token=$(openssl rand -hex 32)
          echo "::add-mask::$db_password"
          echo "::add-mask::$admin_token"
          {
            echo "DB_PASSWORD=$db_password"
            echo "ADMIN_TOKEN=$admin_token"
          } >> "$GITHUB_ENV"
          sed -i "s/^SIGNALHUB_DB_PASSWORD=.*/SIGNALHUB_DB_PASSWORD=$db_password/" .env
          sed -i "s/^SIGNALHUB_ADMIN_TOKEN=.*/SIGNALHUB_ADMIN_TOKEN=$admin_token/" .env
          printf '%s\n' COMPOSE_PROFILES=proxy "SIGNALHUB_DOMAIN=$DOMAIN" SIGNALHUB_TLS=internal >> .env
          # A throwaway service account key outside the repository; nothing is
          # sent, so it never reaches Google.
          key_file="$RUNNER_TEMP/fcm-service-account.json"
          openssl genpkey -quiet -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/fcm-key.pem"
          jq --null-input --rawfile key "$RUNNER_TEMP/fcm-key.pem" '{
              type: "service_account", project_id: "signalhub-fresh-install", private_key_id: "ci",
              private_key: $key, client_email: "signalhub@signalhub-fresh-install.iam.gserviceaccount.com",
              token_uri: "https://oauth2.googleapis.com/token"}' > "$key_file"
          # The permissions of docs/deployment.md#secrets.
          chmod 400 "$key_file" && sudo chown 10001 "$key_file"
          # docs/development.md#firebase-cloud-messaging and architecture.md#resources.
          cat > compose.override.yaml <<YAML
          services:
            backend:
              mem_limit: 512m
              cpus: 1
              environment:
                SIGNALHUB_PUSH_FCM_CREDENTIALS_FILE: /run/secrets/fcm.json
              volumes:
                - $key_file:/run/secrets/fcm.json:ro
            postgres:
              mem_limit: 256m
          YAML
      - name: Start the stack
        working-directory: ${{ runner.temp }}/signalhub
        run: |
          docker compose up --wait
          # Nothing was built: the backend runs the image the files name.
          test "$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps --quiet backend)")" = signalhub-backend:check
          logs=$(docker compose logs backend)
          grep --quiet --fixed-strings 'SignalHub 0.0.0-ci (commit' <<<"$logs"
          grep --quiet 'FCM push enabled for Firebase project signalhub-fresh-install' <<<"$logs"
          grep --quiet 'Push providers: \[fcm\]' <<<"$logs"
          if grep --quiet --fixed-strings --regexp "$DB_PASSWORD" --regexp "$ADMIN_TOKEN" <<<"$logs"; then
            echo "a secret was logged"; exit 1
          fi
      - name: The host publishes only the ports docs/deployment.md lists
        working-directory: ${{ runner.temp }}/signalhub
        run: |
          test "$(stat --format %a .env)" = 600
          # Host address and port of every published container port, as "ip:port".
          published() {
            docker inspect "$(docker compose ps --quiet "$1")" \
              | jq --raw-output '[.[0].NetworkSettings.Ports[] // [] | .[] | "\(.HostIp):\(.HostPort)"]
                  | unique | join(" ")'
          }
          for service in postgres backend proxy; do
            echo "$service: $(published "$service")"
          done
          test "$(published postgres)" = ""
          test "$(published backend)" = "127.0.0.1:8080"
          # The proxy on 80 and 443 of every address (IPv4, and IPv6 where Docker has it).
          test "$(published proxy | tr ' ' '\n' | sed 's/.*://' | sort --unique | paste --serial --delimiters ' ')" \
            = '443 80'
      - name: Other machines reach the API over TLS, with Caddy's own CA
        working-directory: ${{ runner.temp }}/signalhub
        run: |
          docker compose exec -T proxy cat /data/caddy/pki/authorities/local/root.crt > signalhub-ca.crt
          echo "SSL_CERT_FILE=$PWD/signalhub-ca.crt" >> "$GITHUB_ENV"
          # 401: the API answers, over TLS.
          status=$(curl --silent --output response.json --write-out '%{http_code}' \
            --retry 10 --retry-delay 1 --retry-all-errors \
            --cacert signalhub-ca.crt "$SIGNALHUB_URL/api/v1/events")
          test "$status" = 401 || { echo "expected 401, got $status"; exit 1; }
          jq --exit-status '.status == 401' response.json
      - name: The operator manages on the host; producers and clients go through the proxy
        working-directory: ${{ runner.temp }}/signalhub
        run: |
          admin() {
            curl --fail --silent --show-error --header "Authorization: Bearer $ADMIN_TOKEN" \
              --header 'Content-Type: application/json' --data "$2" "http://localhost:8080$1"
          }
          SIGNALHUB_API_KEY=$(admin /api/v1/admin/producers '{"name": "fresh-install"}' | jq --raw-output .apiKey)
          client_key=$(admin /api/v1/admin/clients '{"name": "fresh-install-phone"}' | jq --raw-output .clientKey)
          echo "::add-mask::$SIGNALHUB_API_KEY"
          echo "::add-mask::$client_key"
          echo "CLIENT_KEY=$client_key" >> "$GITHUB_ENV"
          export SIGNALHUB_API_KEY
          # The Python command trusts the CA through SSL_CERT_FILE.
          id=$(signalhub send --category INFO --severity LOW --title "SignalHub is installed")
          echo "EVENT_ID=$id" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --cacert signalhub-ca.crt \
            --header "Authorization: Bearer $client_key" "$SIGNALHUB_URL/api/v1/events" \
            | jq --exit-status --arg id "$id" '[.items[].id] == [$id]'
          # The management API is never reachable through the proxy.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --cacert signalhub-ca.crt \
            --header "Authorization: Bearer $ADMIN_TOKEN" "$SIGNALHUB_URL/api/v1/admin/producers")" = 404
      - name: Without the admin token, management is off and clients keep reading
        working-directory: ${{ runner.temp }}/signalhub
        run: |
          # The tightest setup of docs/deployment.md#secrets.
          sed -i 's/^SIGNALHUB_ADMIN_TOKEN=.*/SIGNALHUB_ADMIN_TOKEN=/' .env
          docker compose up --wait
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $ADMIN_TOKEN" http://localhost:8080/api/v1/admin/producers)" = 404
          curl --fail --silent --show-error --cacert signalhub-ca.crt \
            --header "Authorization: Bearer $CLIENT_KEY" "$SIGNALHUB_URL/api/v1/events" \
            | jq --exit-status '[.items[].id] == [env.EVENT_ID]'
      - name: Every service comes back by itself when Docker restarts, as after a reboot
        working-directory: ${{ runner.temp }}/signalhub
        run: |
          sudo systemctl restart docker
          # No docker compose command: the restart policy alone brings the stack back.
          for _ in $(seq 90); do
            if curl --fail --silent --output /dev/null --cacert signalhub-ca.crt \
                --header "Authorization: Bearer $CLIENT_KEY" "$SIGNALHUB_URL/api/v1/events"; then
              break
            fi
            sleep 2
          done
          docker compose ps
          for service in postgres backend proxy; do
            test "$(docker inspect --format '{{.State.Running}}' "$(docker compose ps --quiet "$service")")" = true
          done
          curl --fail --silent --show-error --cacert signalhub-ca.crt \
            --header "Authorization: Bearer $CLIENT_KEY" "$SIGNALHUB_URL/api/v1/events" \
            | jq --exit-status '[.items[].id] == [env.EVENT_ID]'
      - if: failure()
        working-directory: ${{ runner.temp }}/signalhub
        run: docker compose logs
      - if: always()
        working-directory: ${{ runner.temp }}/signalhub
        run: docker compose down --volumes
