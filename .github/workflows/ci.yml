name: CI

# Runs on every pull request. The release workflow also calls it, so the exact
# commit on main is re-validated before it is tagged.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  # The Flutter SDK the client is built with (docs/development.md, "Client").
  FLUTTER_VERSION: 3.47.5

# Supersede outdated runs for the same PR. When called by the release workflow,
# the group is unique per run and the caller serializes releases itself.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The last one is the default. 3.10 is the oldest the SDK supports
          # (sdk/python/pyproject.toml, requires-python).
          python-version: |
            3.10
            3.12
      - run: pip install ruff==0.16.9
      - run: ruff check .
      - run: ruff format --check .
      - name: Test release versioning
        run: python -m unittest discover --start-directory scripts/release --verbose
      # Installing the SDK also checks its build and the `signalhub` command.
      - run: pip install ./sdk/python && signalhub send --help
      - name: Test the Python SDK
        run: python -m unittest discover --start-directory sdk/python/tests --top-level-directory sdk/python --verbose
      - name: Test the Python SDK on its oldest supported Python
        run: |
          python3.10 -m pip install ./sdk/python
          python3.10 -m unittest discover --start-directory sdk/python/tests --top-level-directory sdk/python

  workflows:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The actionlint image bundles shellcheck, so `run:` scripts are checked too.
      - run: docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      # Compiles, runs the tests against real PostgreSQL (Dev Services and
      # Testcontainers use the runner's Docker), checks formatting (Spotless)
      # and runs static analysis (SpotBugs).
      - run: ./mvnw --batch-mode --no-transfer-progress verify

  client:
    name: Client (analyze + test + Android build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Flutter
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics && flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      # Without Firebase options the app builds and runs without push, so no
      # credentials are needed here.
      - run: flutter build apk --debug

  client-ios:
    name: Client (iOS build)
    runs-on: macos-15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - name: Install Flutter
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics && flutter --version
      - run: flutter pub get --enforce-lockfile
      # Compiles the app and its native plugins for devices; signing needs the
      # owner's Apple account and happens on their machine.
      - run: flutter build ios --debug --no-codesign

  # Runs natively on x86-64 and on ARM64 (such as a Raspberry Pi 5), so the
  # image is built and the whole stack is checked on both. The x86-64 job keeps
  # its name, which branch protection requires.
  compose:
    name: ${{ matrix.arch == 'arm64' && 'Backend container (Compose smoke test, ARM64)' || 'Backend container (Compose smoke test)' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Start PostgreSQL and the backend
        run: |
          cp .env.example .env
          admin_token=$(openssl rand -hex 32)
          echo "::add-mask::$admin_token"
          echo "ADMIN_TOKEN=$admin_token" >> "$GITHUB_ENV"
          sed -i "s/^SIGNALHUB_ADMIN_TOKEN=.*/SIGNALHUB_ADMIN_TOKEN=$admin_token/" .env
          # The resource limits recommended in docs/architecture.md#resources.
          cat > compose.override.yaml <<'YAML'
          services:
            backend:
              mem_limit: 512m
              cpus: 1
            postgres:
              mem_limit: 256m
          YAML
          docker compose up --build --wait --wait-timeout 180
          test "$(docker inspect --format '{{.HostConfig.Memory}}' "$(docker compose ps --quiet backend)")" = 536870912
      - name: The images are built for the runner's architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          for service in backend postgres; do
            image=$(docker inspect --format '{{.Image}}' "$(docker compose ps --quiet "$service")")
            arch=$(docker image inspect --format '{{.Architecture}}' "$image")
            echo "$service: $arch"
            test "$arch" = "$ARCH" || { echo "expected $ARCH, got $arch"; exit 1; }
          done
      - name: Liveness, readiness and OpenAPI respond
        run: |
          curl --fail --silent --show-error http://localhost:8080/q/health/live
          curl --fail --silent --show-error http://localhost:8080/q/health/ready
          curl --fail --silent --show-error --output /dev/null http://localhost:8080/q/openapi
      - name: Register a producer through the management API
        run: |
          created=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $ADMIN_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"name": "ci-smoke-test"}' \
            http://localhost:8080/api/v1/admin/producers)
          api_key=$(jq --raw-output .apiKey <<<"$created")
          echo "::add-mask::$api_key"
          {
            echo "API_KEY=$api_key"
            echo "PRODUCER_ID=$(jq --raw-output .producer.id <<<"$created")"
            echo "KEY_ID=$(jq --raw-output .keyId <<<"$created")"
          } >> "$GITHUB_ENV"
      - name: Publishing without a valid key is rejected
        run: |
          publish_status() {
            curl --silent --output /dev/null --write-out '%{http_code}' "$@" \
              --header 'Content-Type: application/json' \
              --data '{"category": "INFO", "severity": "LOW", "title": "Rejected"}' \
              http://localhost:8080/api/v1/events
          }
          test "$(publish_status)" = 401
          test "$(publish_status --header 'Authorization: Bearer shpk1_not-a-key')" = 401
          test "$(publish_status --header "Authorization: Bearer $ADMIN_TOKEN")" = 401
      - name: A published event survives a backend restart
        run: |
          id=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $API_KEY" \
            --header 'Content-Type: application/json' \
            --data '{"category": "INFO", "severity": "LOW", "title": "Smoke test", "metadata": {"check": "restart"}}' \
            http://localhost:8080/api/v1/events | jq --raw-output .id)
          echo "created event $id"
          docker compose restart backend
          docker compose up --wait --wait-timeout 120
          curl --fail --silent --show-error "http://localhost:8080/api/v1/events/$id" \
            | jq --exit-status '.title == "Smoke test" and .metadata.check == "restart"
                and .producer.name == "ci-smoke-test" and .producer.id == env.PRODUCER_ID'
      - name: The owner lists the event with the admin token
        run: |
          curl --fail --silent --show-error --get \
            --header "Authorization: Bearer $ADMIN_TOKEN" \
            --data-urlencode "producerId=$PRODUCER_ID" --data-urlencode 'limit=10' \
            http://localhost:8080/api/v1/events \
            | jq --exit-status '(.items | length) == 1 and .items[0].title == "Smoke test"
                and .nextCursor == null'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://localhost:8080/api/v1/events)
          test "$status" = 401 || { echo "expected 401, got $status"; exit 1; }
      - name: A registered client lists events, marks them read and sets its push target and preferences
        run: |
          created=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $ADMIN_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"name": "ci-smoke-client"}' \
            http://localhost:8080/api/v1/admin/clients)
          client_key=$(jq --raw-output .clientKey <<<"$created")
          client_id=$(jq --raw-output .client.id <<<"$created")
          echo "::add-mask::$client_key"
          curl --fail --silent --show-error --get \
            --header "Authorization: Bearer $client_key" \
            --data-urlencode "producerId=$PRODUCER_ID" \
            http://localhost:8080/api/v1/events \
            | jq --exit-status '.items[0].title == "Smoke test" and .items[0].readAt == null'
          newest=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $client_key" \
            "http://localhost:8080/api/v1/events?limit=1" | jq --raw-output '.items[0].id')
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $client_key" \
            --header 'Content-Type: application/json' \
            --data "{\"through\": \"$newest\"}" \
            http://localhost:8080/api/v1/events/read \
            | jq --exit-status '.marked >= 1'
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $client_key" \
            http://localhost:8080/api/v1/events/unread-count \
            | jq --exit-status '.unread == 0'
          curl --fail --silent --show-error --request PUT \
            --header "Authorization: Bearer $client_key" \
            --header 'Content-Type: application/json' \
            --data '{"provider": "fcm", "token": "ci-smoke-token"}' \
            http://localhost:8080/api/v1/client/push-target \
            | jq --exit-status '.pushTarget.provider == "fcm" and (.pushTarget | has("token") | not)'
          curl --fail --silent --show-error --request PUT \
            --header "Authorization: Bearer $client_key" \
            --header 'Content-Type: application/json' \
            --data '{"minimumSeverity": "HIGH", "mutedCategories": ["INFO"]}' \
            http://localhost:8080/api/v1/client/push-preferences \
            | jq --exit-status '.pushPreferences == {"enabled": true, "minimumSeverity": "HIGH",
                "mutedCategories": ["INFO"], "mutedProducerIds": []}'
          curl --fail --silent --show-error --output /dev/null --request POST \
            --header "Authorization: Bearer $ADMIN_TOKEN" \
            "http://localhost:8080/api/v1/admin/clients/$client_id/revoke"
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $client_key" http://localhost:8080/api/v1/events)
          test "$status" = 401 || { echo "expected 401, got $status"; exit 1; }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # After the listings above, which expect only the "Smoke test" event.
      - name: The Python command publishes an event
        env:
          SIGNALHUB_URL: http://localhost:8080
        run: |
          pip install ./sdk/python
          id=$(SIGNALHUB_API_KEY=$API_KEY signalhub send --category action-required \
            --severity HIGH --title "From the command" --context ci/sdk \
            --metadata '{"run": 42}' --meta step=smoke)
          curl --fail --silent --show-error "http://localhost:8080/api/v1/events/$id" \
            | jq --exit-status '.category == "ACTION_REQUIRED" and .title == "From the command"
                and .metadata == {"run": 42, "step": "smoke"} and .producer.id == env.PRODUCER_ID'
          status=0
          SIGNALHUB_API_KEY=shpk1_not-a-key signalhub send --category INFO --severity LOW \
            --title Rejected || status=$?
          test "$status" = 1 || { echo "expected exit status 1, got $status"; exit 1; }
      - name: Metrics count the events published since the restart
        run: |
          metrics=$(curl --fail --silent --show-error --header 'Accept: text/plain' \
            http://localhost:8080/q/metrics)
          # Only the Python command's event was stored after the restart; rejected ones do not count.
          grep --quiet '^signalhub_events_published_total 1.0$' <<<"$metrics"
          grep --quiet '^signalhub_push_dispatch_pending ' <<<"$metrics"
          grep --quiet '^agroal_active_count' <<<"$metrics"
          grep --quiet '^http_server_requests_seconds_count{.*uri="/api/v1/events/{id}"' <<<"$metrics"
      - name: JSON logs carry the startup summary and no secrets
        run: |
          echo 'SIGNALHUB_LOG_JSON=true' >> .env
          echo 'SIGNALHUB_EVENTS_RETENTION=400d' >> .env
          docker compose up --wait --wait-timeout 120   # recreates the backend
          logs=$(docker compose logs --no-log-prefix backend)
          db_password=$(sed -n 's/^SIGNALHUB_DB_PASSWORD=//p' .env)
          # Every line is a JSON object: jq fails on the first one that is not.
          jq --raw-input 'fromjson | .message' <<<"$logs" > /dev/null
          summary=$(jq --raw-input --raw-output \
            'fromjson | select(.loggerName | endswith(".StartupDiagnostics")) | .message' <<<"$logs")
          echo "$summary"
          grep --quiet '^Configuration: profile prod; database jdbc:postgresql://postgres:5432/signalhub as signalhub; management API enabled; .*event retention 400d; JSON logs on' <<<"$summary"
          if grep --quiet --fixed-strings --regexp="$ADMIN_TOKEN" --regexp="$db_password" <<<"$logs"; then
            echo "a secret reached the logs"; exit 1
          fi
      # The commands of docs/architecture.md#backup-and-restore.
      - name: A backup restores into an empty database
        run: |
          backup="$RUNNER_TEMP/signalhub.dump"
          docker compose exec -T postgres sh -c \
            'pg_dump --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --format=custom' \
            > "$backup"
          docker compose exec -T postgres pg_restore --list < "$backup" > /dev/null
          publish() {
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $API_KEY" \
              --header 'Content-Type: application/json' \
              --data "{\"category\": \"INFO\", \"severity\": \"LOW\", \"title\": \"$1\"}" \
              http://localhost:8080/api/v1/events | jq --raw-output .id
          }
          later=$(publish "After the backup")
          docker compose down --volumes
          docker compose up --wait --wait-timeout 120 postgres
          restore() {
            docker compose exec -T postgres sh -c \
              'pg_restore --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --no-owner --no-privileges --exit-on-error --single-transaction' \
              < "$backup"
          }
          restore
          docker compose up --wait --wait-timeout 120
          # Events from before the backup are back, with their read state; later ones are gone.
          curl --fail --silent --show-error --get \
            --header "Authorization: Bearer $ADMIN_TOKEN" \
            --data-urlencode "producerId=$PRODUCER_ID" \
            http://localhost:8080/api/v1/events \
            | jq --exit-status '[.items[].title] == ["From the command", "Smoke test"]
                and .items[1].readAt != null'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "http://localhost:8080/api/v1/events/$later")
          test "$status" = 404 || { echo "expected 404, got $status"; exit 1; }
          # The producer's key still works: the backup holds its hash.
          publish "After the restore" > /dev/null
          # Restoring over existing data fails and changes nothing.
          if restore 2> /dev/null; then echo "restored over existing data"; exit 1; fi
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ADMIN_TOKEN" \
            http://localhost:8080/api/v1/events/unread-count \
            | jq --exit-status '.unread == 2'
      - name: A revoked key no longer authenticates
        run: |
          curl --fail --silent --show-error --output /dev/null --request POST \
            --header "Authorization: Bearer $ADMIN_TOKEN" \
            "http://localhost:8080/api/v1/admin/producers/$PRODUCER_ID/keys/$KEY_ID/revoke"
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $API_KEY" \
            --header 'Content-Type: application/json' \
            --data '{"category": "INFO", "severity": "LOW", "title": "Revoked"}' \
            http://localhost:8080/api/v1/events)
          test "$status" = 401 || { echo "expected 401, got $status"; exit 1; }
      - name: Readiness reports DOWN while PostgreSQL is stopped
        run: |
          docker compose stop postgres
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/q/health/ready)
          test "$status" = 503 || { echo "expected 503, got $status"; exit 1; }
          curl --fail --silent --show-error http://localhost:8080/q/health/live
          docker compose start postgres
          docker compose up --wait --wait-timeout 120
      - name: The image refuses to start without database settings
        run: |
          docker run --detach --name no-database signalhub-backend:local
          code=$(timeout 60 docker wait no-database) || { echo "still running after 60s"; exit 1; }
          docker logs no-database 2>&1 | grep 'No database configured'
          test "$code" != 0
      - if: always()
        run: docker stats --no-stream
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
