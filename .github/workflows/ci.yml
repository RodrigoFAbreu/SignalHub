name: CI

# Runs on every pull request, every part of it: no part is skipped by the files a
# change touches, since every merge to main is a release. The release workflow
# also calls it, so the exact commit on main is re-validated before it is tagged.
#
# Each part is a reusable workflow that can also be run alone from the Actions
# tab (docs/development.md#continuous-integration):
#
#   ci-python.yml      the repository's Python tooling, the SDK, the examples
#                      and the workflows' own lint
#   ci-backend.yml     the backend's build and tests
#   ci-app.yml         the Flutter app: checks, Android and iOS builds
#   ci-image.yml       the backend image, built once per architecture
#   ci-web.yml         the users' web page in a browser
#   ci-containers.yml  the Compose stack, upgrades, a fresh install, end to end
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Supersede outdated runs for the same PR. When called by the release workflow,
# the group is unique per run and the caller serializes releases itself.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  python:
    uses: ./.github/workflows/ci-python.yml
  backend:
    uses: ./.github/workflows/ci-backend.yml
  app:
    uses: ./.github/workflows/ci-app.yml
  image:
    uses: ./.github/workflows/ci-image.yml
  # The two parts that start the stack use the images the image part built.
  web:
    needs: image
    uses: ./.github/workflows/ci-web.yml
    with:
      images: backend-images-amd64
  containers:
    needs: image
    uses: ./.github/workflows/ci-containers.yml
    with:
      images: backend-images

  # The branch protection of main requires these checks by name (docs/development.md,
  # "Repository settings"). A job of a called workflow is reported as "caller / job",
  # so each name is reported here, passing only when the part that holds its job
  # passed. Add a check to a part and its name here, and to the ruleset.
  required:
    name: ${{ matrix.check }}
    if: ${{ always() }}
    needs: [python, backend, app, image, web, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: python, check: "Python (lint + test)" }
          - { part: python, check: "GitHub Actions lint" }
          - { part: backend, check: "Backend (build + test)" }
          - { part: app, check: "Client (analyze + test + Android build)" }
          - { part: app, check: "Client (iOS build)" }
          - { part: image, check: "Backend image (release build)" }
          - { part: image, check: "Backend image (release build, ARM64)" }
          - { part: web, check: "Web page (browser tests)" }
          - { part: containers, check: "Backend container (Compose smoke test)" }
          - { part: containers, check: "Backend container (Compose smoke test, ARM64)" }
          - { part: containers, check: "Backend container (upgrade from the latest release)" }
          - { part: containers, check: "Backend container (upgrade from v0.13.0)" }
          - { part: containers, check: "End-to-end (producer to push and client inbox)" }
          - { part: containers, check: "Deployment (fresh install from docs/deployment.md)" }
    steps:
      - env:
          PART: ${{ matrix.part }}
          RESULT: ${{ needs[matrix.part].result }}
        run: |
          echo "$PART: $RESULT"
          if [ "$RESULT" != success ]; then
            echo "::error::The $PART part of CI did not succeed ($RESULT); see its jobs above."
            exit 1
          fi
