name: CI - Stacks

# Everything that starts the backend as a container, in a few jobs that each run
# some of its tests one after another (the "lanes" below), sharing the checkout,
# the loaded images and Python: the web page in a browser (web-tests/), the Compose
# stack, the upgrades, the fresh install and the end-to-end path of an event, the
# last four checked by the Python tests of container-tests/
# (container-tests/README.md). Each test is a composite action in
# .github/actions/stack-*, which leaves no stack, file or setting behind.
# Called by ci.yml, which hands it the images its image part built, one build per
# architecture; run alone from the Actions tab, every job builds them itself.
on:
  workflow_call:
    inputs:
      images:
        description: The prefix of the image part's artifacts (backend-images); empty to build the images in each job.
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Few jobs hold few runners at once (docs/development.md#continuous-integration):
  # four lanes of about the same length, which together last as long as the
  # longest of the former jobs plus the image build. The tests run in the order
  # listed by the steps below, not the order of a lane's list: those that start
  # the development image (web, compose, e2e) come before those that remove it
  # (fresh, upgrades).
  stacks:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Stacks (Compose smoke test, upgrades from the latest release and v3.5.0)
            arch: amd64
            runner: ubuntu-latest
            tests: [compose, upgrade-latest, upgrade-v3.5.0]
          # Natively on ARM64 (such as a Raspberry Pi 5), so the whole stack is
          # checked on both architectures.
          - name: Stacks (Compose smoke test, ARM64)
            arch: arm64
            runner: ubuntu-24.04-arm
            tests: [compose]
          - name: Stacks (web page)
            arch: amd64
            runner: ubuntu-latest
            tests: [web]
          - name: Stacks (end-to-end, fresh install, upgrade from v0.13.0)
            arch: amd64
            runner: ubuntu-latest
            tests: [e2e, fresh-install, upgrade-v0.13.0]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release tags, for the upgrades
      - uses: ./.github/actions/load-backend-images
        with:
          artifact: ${{ inputs.images && format('{0}-{1}', inputs.images, matrix.arch) || '' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The Python command and the examples the tests run.
      - run: pip install ./sdk/python

      # A test that fails does not stop the others of its lane.
      - if: ${{ !cancelled() && contains(matrix.tests, 'compose') }}
        uses: ./.github/actions/stack-compose
        with:
          arch: ${{ matrix.arch }}
      - if: ${{ !cancelled() && contains(matrix.tests, 'web') }}
        uses: ./.github/actions/stack-web
      - if: ${{ !cancelled() && contains(matrix.tests, 'e2e') }}
        uses: ./.github/actions/stack-e2e

      # They remove the development image, so that an earlier release cannot run it
      # by mistake: after the tests above.
      - if: ${{ !cancelled() && contains(matrix.tests, 'fresh-install') }}
        uses: ./.github/actions/stack-fresh-install
      # With the TLS proxy, whose configuration the upgrade must put in effect
      # (docs/deployment.md#upgrades).
      - if: ${{ !cancelled() && contains(matrix.tests, 'upgrade-latest') }}
        uses: ./.github/actions/stack-upgrade
        with:
          from: the latest release
          proxy: "true"
      # The last release whose proxy/Caddyfile does not forward /app/.
      - if: ${{ !cancelled() && contains(matrix.tests, 'upgrade-v3.5.0') }}
        uses: ./.github/actions/stack-upgrade
        with:
          from: v3.5.0
          release: v3.5.0
          proxy: "true"
      # The oldest release that stores every kind of data the upgrade checks:
      # events, producer keys, clients, read state and push preferences.
      - if: ${{ !cancelled() && contains(matrix.tests, 'upgrade-v0.13.0') }}
        uses: ./.github/actions/stack-upgrade
        with:
          from: v0.13.0
          release: v0.13.0
