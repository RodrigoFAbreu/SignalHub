name: CI - App

# The Flutter app: format, analysis and unit tests, the release's Android build
# and the iOS build. Called by ci.yml; also runnable alone from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Flutter SDK the client is built with (docs/development.md, "Client").
  FLUTTER_VERSION: 3.47.5

jobs:
  check:
    name: Client (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: shellcheck icon/render.sh
      # The committed alert sounds are what their generator makes.
      - run: python3 sounds/generate.py --check
      - run: flutter test

  android:
    name: Client (Android release build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          # The Gradle distribution and the dependencies the build downloads.
          cache: gradle
          cache-dependency-path: |
            client/android/**/*.gradle*
            client/android/gradle/wrapper/gradle-wrapper.properties
      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get --enforce-lockfile
        working-directory: client
      # The release's app build and its checks (scripts/release/app_files.py),
      # signed with a throwaway key made here, so the release build cannot
      # break unnoticed. No Firebase options: the app reads its server's.
      - name: Build the release APK as the release does
        run: |
          signing="$RUNNER_TEMP/signing"
          mkdir --mode=700 "$signing"
          ANDROID_RELEASE_KEYSTORE="$signing/throwaway.jks"
          ANDROID_RELEASE_KEYSTORE_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          ANDROID_RELEASE_KEY_PASSWORD=$ANDROID_RELEASE_KEYSTORE_PASSWORD
          ANDROID_RELEASE_KEY_ALIAS=throwaway
          export ANDROID_RELEASE_KEYSTORE ANDROID_RELEASE_KEYSTORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD
          keytool -genkeypair -keystore "$ANDROID_RELEASE_KEYSTORE" -storetype PKCS12 \
            -alias "$ANDROID_RELEASE_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=SignalHub CI throwaway key" \
            -storepass:env ANDROID_RELEASE_KEYSTORE_PASSWORD -keypass:env ANDROID_RELEASE_KEY_PASSWORD
          mkdir "$RUNNER_TEMP/app"
          python3 scripts/release/app_files.py 0.0.0-ci "$(git rev-parse HEAD)" "$RUNNER_TEMP/app"
          rm -rf "$signing"

  ios:
    name: Client (iOS build)
    runs-on: macos-15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get --enforce-lockfile
      # Compiles the app and its native plugins for devices; signing needs the
      # owner's Apple account and happens on their machine.
      - run: flutter build ios --debug --no-codesign
