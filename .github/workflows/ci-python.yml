name: CI - Python and workflows
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    uses: RodrigoFAbreu/action-workflows/.github/workflows/python-tests.yml@main
    with:
      # The last version is the default. The SDK also supports Python 3.10.
      python-version: |
        3.10
        3.12
      requirements-file: .github/tools/requirements.txt
      cache-dependency-path: |
        .github/tools/requirements.txt
        sdk/python/pyproject.toml
      test-command: bash scripts/ci/check-python.sh
      after-test-command: bash scripts/ci/check-workflows.sh
