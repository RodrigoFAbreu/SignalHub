name: Release

# Every commit on main is a release: re-run CI on the merged commit, publish the
# backend image for it, check that image on both platforms, then tag the commit
# with the next semantic version and publish a GitHub release naming the image,
# with the deployment files that run it, the Python SDK's files and the signed
# Android app attached.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Serialize releases so two runs never compute the same version. Queued runs
# are never cancelled mid-flight; a superseded pending run is covered by the
# next one (see docs/development.md).
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/rodrigofabreu/signalhub
  FLUTTER_VERSION: 3.47.5 # the same as in ci.yml

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.version.outputs.next }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags are needed to find the last release
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: version
        run: |
          next=$(python scripts/release/release.py next-version)
          echo "next=$next" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.next == ''
        run: echo "HEAD is already released; nothing to do."

  # Each platform is built natively on its own runner and pushed by digest,
  # untagged; the image job joins them under the version's tag.
  image-amd64:
    needs: version
    if: needs.version.outputs.next != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - id: build
        env:
          NEXT: ${{ needs.version.outputs.next }}
        run: echo "digest=$(scripts/release/build-image.sh "${NEXT#v}" "$GITHUB_SHA" push)" >> "$GITHUB_OUTPUT"

  image-arm64:
    needs: version
    if: needs.version.outputs.next != ''
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - id: build
        env:
          NEXT: ${{ needs.version.outputs.next }}
        run: echo "digest=$(scripts/release/build-image.sh "${NEXT#v}" "$GITHUB_SHA" push)" >> "$GITHUB_OUTPUT"

  # Tags the two platforms as one multi-platform image, ghcr.io/...:X.Y.Z. Only
  # that exact version is tagged: no `latest`, no `X.Y`.
  image:
    needs: [version, image-amd64, image-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.tag.outputs.digest }}
    steps:
      - env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - id: tag
        env:
          NEXT: ${{ needs.version.outputs.next }}
          AMD64: ${{ needs.image-amd64.outputs.digest }}
          ARM64: ${{ needs.image-arm64.outputs.digest }}
        run: |
          version=${NEXT#v}
          docker buildx imagetools create --tag "$IMAGE:$version" \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.version=$version" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.description=SignalHub $version backend" \
            "$IMAGE@$AMD64" "$IMAGE@$ARM64"
          digest=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest}}' | jq --raw-output .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # Pulls the tagged image on each platform, as an operator would, and checks
  # that it runs and reports this release and commit.
  check:
    needs: [version, image]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      # The package may still be private (docs/development.md#release-process).
      - env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - env:
          NEXT: ${{ needs.version.outputs.next }}
        run: |
          docker pull "$IMAGE:${NEXT#v}"
          scripts/release/check-image.sh "$IMAGE:${NEXT#v}" "${NEXT#v}" "$GITHUB_SHA"

  # The release's Android app, SignalHub-X.Y.Z.apk, signed with SignalHub's
  # release key (client/README.md#signing). The key exists only in this job,
  # in a directory removed at its end; it is never printed or uploaded.
  app:
    needs: version
    if: needs.version.outputs.next != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Flutter
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics && flutter --version
      - working-directory: client
        run: flutter pub get --enforce-lockfile
      - id: build
        name: Build and check the signed APK
        env:
          NEXT: ${{ needs.version.outputs.next }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          # Never an unsigned or debug-signed app: without the key, no release.
          for name in KEYSTORE_BASE64 ANDROID_RELEASE_KEYSTORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The release signing secret for $name is not set (client/README.md#signing)."
              exit 1
            fi
          done
          signing="$RUNNER_TEMP/signing"
          mkdir --mode=700 "$signing"
          export ANDROID_RELEASE_KEYSTORE="$signing/release.jks"
          (umask 077 && printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_RELEASE_KEYSTORE")
          unset KEYSTORE_BASE64
          mkdir "$RUNNER_TEMP/app"
          python3 scripts/release/app_files.py "${NEXT#v}" "$GITHUB_SHA" "$RUNNER_TEMP/app" > "$RUNNER_TEMP/app.out"
          { read -r apk; read -r certificate; } < "$RUNNER_TEMP/app.out"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "certificate=$certificate" >> "$GITHUB_OUTPUT"
      - name: Remove the signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.build.outputs.apk }}
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error
          retention-days: 1
    outputs:
      certificate: ${{ steps.build.outputs.certificate }}

  release:
    needs: [version, image, check, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --requirement .github/tools/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: ${{ runner.temp }}/assets
      - env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ needs.version.outputs.next }}
          DIGEST: ${{ needs.image.outputs.digest }}
          CERTIFICATE: ${{ needs.app.outputs.certificate }}
        run: |
          version=${NEXT#v}
          # The files docs/deployment.md installs and upgrades from, running this image.
          # The app is already in assets/, downloaded from the app job.
          archive=$(python scripts/release/deployment_files.py "$IMAGE:$version@$DIGEST" "$version" "$RUNNER_TEMP/assets")
          # The Python SDK's wheel and source archive, reporting this version.
          python scripts/release/sdk_files.py "$version" "$RUNNER_TEMP/assets"
          (cd "$RUNNER_TEMP/assets" && sha256sum -- * > SHA256SUMS)
          notes=$(printf '%s\n' \
            '## Backend image' \
            '' \
            '```text' \
            "$IMAGE:${NEXT#v}" \
            "$IMAGE@$DIGEST" \
            '```' \
            '' \
            "For \`linux/amd64\` and \`linux/arm64\`. Install or upgrade with the attached \`$(basename "$archive")\`, which runs this image; see [docs/deployment.md](https://github.com/$GITHUB_REPOSITORY/blob/$NEXT/docs/deployment.md)." \
            '' \
            '## Python SDK and command' \
            '' \
            "Install the attached \`signalhub-$version-py3-none-any.whl\`; see [sdk/python/README.md](https://github.com/$GITHUB_REPOSITORY/blob/$NEXT/sdk/python/README.md#install)." \
            '' \
            '## Android app' \
            '' \
            "Install the attached \`SignalHub-$version.apk\`; see [client/README.md](https://github.com/$GITHUB_REPOSITORY/blob/$NEXT/client/README.md#install-a-release). It is signed with SignalHub's release key, whose certificate has the SHA-256 digest" \
            '' \
            '```text' \
            "$CERTIFICATE" \
            '```')
          # The generated notes follow these; the deployment files, the SDK's
          # files, the app and their checksums are the release's assets.
          gh release create "$NEXT" --target "$GITHUB_SHA" --title "$NEXT" --notes "$notes" --generate-notes \
            "$RUNNER_TEMP"/assets/*
